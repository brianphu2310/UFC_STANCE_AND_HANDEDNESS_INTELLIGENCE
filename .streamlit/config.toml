# Stance Intelligence: true-black flat; red and blue corners are data colours only. Keep in step with the tokens in ui.py.
[server]
enableStaticServing = true          # serves static/ (self-hosted fonts, mark, globe topology)

[theme]
base = "dark"
primaryColor = "#FFFFFF"            # sliders, toggles and focus stay neutral: colour is for data
backgroundColor = "#000000"         # BG
secondaryBackgroundColor = "#111111" # SURFACE: inputs, selects, code
textColor = "#FFFFFF"               # INK
font = "sans serif"
baseRadius = "8px"
borderColor = "#444444"               # CONTROL
dataframeBorderColor = "#1F1F1F"
dataframeHeaderBackgroundColor = "#111111"
dataframeHeaderTextColor = "#949494"
