# Stance Intelligence: fight-night broadcast, red corner and blue corner. Keep in step with the tokens in ui.py.
[server]
enableStaticServing = true          # serves static/ (self-hosted fonts, mark, globe topology)

[theme]
base = "dark"
primaryColor = "#C8102E"            # ACCENT_FILL: sliders, toggles, radios, selected widgets
backgroundColor = "#0A0A0A"         # BG
secondaryBackgroundColor = "#1F1F20" # SURFACE_2: inputs, selects, code
textColor = "#F5F5F5"               # INK
font = "sans serif"
baseRadius = "0px"
borderColor = "#3A3A3C"               # widget and table hairlines, a step lighter than BORDER
dataframeBorderColor = "#2C2C33"
dataframeHeaderBackgroundColor = "#1F1F20"
dataframeHeaderTextColor = "#C4C1BA"
