<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Body 3D</title>
<style>
  @font-face { font-family: "Instrument Sans"; src: url("/app/static/fonts/instrument-sans-latin-400-normal.woff2") format("woff2"); font-weight: 400; }
  @font-face { font-family: "Instrument Sans"; src: url("/app/static/fonts/instrument-sans-latin-600-normal.woff2") format("woff2"); font-weight: 600; }
  @font-face { font-family: "Big Shoulders Display"; src: url("/app/static/fonts/big-shoulders-display-latin-700-normal.woff2") format("woff2"); font-weight: 700; }
  @font-face { font-family: "Big Shoulders Display"; src: url("/app/static/fonts/big-shoulders-display-latin-800-normal.woff2") format("woff2"); font-weight: 800; }
  :root { --bg:#0C0C0E; --ink:#F2F0ED; --ink2:#C4C1BC; --mute:#8F8C88; --line:#2A2A2F;
          --a:#F04A3E; --afill:#C42A20; --b:#A7ADB8; --rule:#E9B44C; }
  html, body { margin:0; height:100%; background:var(--bg); overflow:hidden; color:var(--ink);
               font-family:"Instrument Sans", "Segoe UI", system-ui, sans-serif; }
  #wrap { position:relative; width:100%; height:100%; overflow:hidden; box-sizing:border-box;
          border:1px solid var(--line); border-radius:6px;
          background: radial-gradient(120% 85% at 50% 8%, #1C1C20 0%, #111113 52%, #0A0A0B 100%); }
  canvas { display:block; position:absolute; inset:0; }
  #labels { position:absolute; inset:0; pointer-events:none; overflow:hidden; }
  .lab { position:absolute; left:0; top:0; white-space:nowrap; will-change:transform; transition:opacity .2s; }
  .tag.l { text-align:right; }
  .tag { font-family:"Big Shoulders Display", sans-serif; font-weight:700; font-size:17px; line-height:1;
         text-align:center; text-shadow:0 0 3px #000, 0 0 8px #000, 0 1px 12px rgba(0,0,0,.9); }
  .tag small { display:block; font-family:"Instrument Sans", sans-serif; font-weight:400; font-size:11.5px;
               color:var(--ink2); margin-top:3px; }
  .chip { font-size:12px; font-weight:600; padding:3px 8px; border-radius:3px; line-height:1.2;
          background:rgba(12,12,14,.88); border:1px solid currentColor; }
  .val { font-family:"Big Shoulders Display", sans-serif; font-weight:700; font-size:15px;
         text-shadow:0 0 3px #000, 0 0 8px #000; }
  .hud { position:absolute; top:12px; left:14px; right:14px; pointer-events:none; display:flex;
         justify-content:space-between; align-items:flex-start; gap:14px; }
  .head { flex:1 1 auto; min-width:0; }
  .rt { border-collapse:collapse; font-size:12px; background:rgba(12,12,14,.78); border:1px solid var(--line);
        border-radius:4px; }
  .rt th, .rt td { padding:4px 9px; text-align:left; white-space:nowrap; }
  .rt th { font-family:"Big Shoulders Display", sans-serif; font-weight:700; font-size:14px; padding-top:6px; }
  .rt td:first-child { color:var(--ink2); }
  .rt tr.on td { background:rgba(233,180,76,.13); }
  .rt td.ok { color:var(--rule); font-weight:600; }
  .rt td.no { color:var(--mute); }
  .head { font-family:"Big Shoulders Display", sans-serif; font-weight:800; font-size:23px; line-height:1.05;
          max-width:560px; text-wrap:balance; }
  .head span { display:block; font-family:"Instrument Sans", sans-serif; font-weight:400; font-size:12.5px;
               line-height:1.4; color:var(--ink2); margin-top:5px; max-width:460px; }
  .bar { position:absolute; left:12px; right:12px; bottom:12px; display:flex; align-items:center;
         gap:6px; flex-wrap:wrap; }
  .seg { display:inline-flex; border:1px solid var(--line); border-radius:4px; overflow:hidden;
         background:rgba(20,20,23,.9); }
  .seg button, .tool { all:unset; cursor:pointer; font-size:12px; padding:6px 9px; color:var(--ink2); }
  .seg button + button { border-left:1px solid var(--line); }
  .seg button.on { background:var(--afill); color:#fff; font-weight:600; }
  .seg button, .tool { min-height:28px; box-sizing:border-box; }
  canvas:focus-visible { outline:2px solid var(--rule); outline-offset:-2px; }
  .sr-only { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
  .tool { padding:6px 9px; color:var(--ink2); background:rgba(20,20,23,.9); border:1px solid var(--line); border-radius:4px; }
  .tool.on { color:var(--ink); border-color:#4A4A52; }
  .seg button:focus-visible, .tool:focus-visible { outline:2px solid var(--rule); outline-offset:-2px; }
  .spacer { flex:1; }
  .key { font-size:11.5px; color:var(--ink2); }
  .key i { display:inline-block; width:14px; height:4px; border-radius:2px; margin-right:6px;
           vertical-align:middle; background:var(--rule); box-shadow:0 0 6px var(--rule); }
  @media (max-width: 900px) { .key { display:none; } }
  @media (max-width: 640px) { .seg button, .tool { padding:5px 7px; font-size:11.5px; } .bar { gap:4px; left:8px; right:8px; } }
  @media (max-width: 600px) { .head { font-size:19px; } .head span { display:none; } .rt { font-size:11px; }
                              .seg button, .tool { padding:5px 8px; font-size:12px; } }
</style>
<script type="importmap">
  { "imports": { "three": "./three.module.min.js" } }
</script>
</head>
<body>
<div id="wrap">
  <p class="sr-only" id="kbd">Focus the 3D view and use the arrow keys to turn it and plus or minus to zoom.</p>
  <div id="labels"></div>
  <div class="hud"><div class="head" id="head"></div><div id="range"></div></div>
  <div class="bar">
    <div class="seg" role="group" aria-label="View">
      <button id="mFace" class="on" aria-pressed="true">Face-off</button>
      <button id="mTape" aria-pressed="false">Height</button>
      <button id="mReach" aria-pressed="false">Reach</button>
    </div>
    <div class="seg" role="group" aria-label="Strike" id="strikes">
      <button data-k="spar" class="on" aria-pressed="true">Spar</button>
      <button data-k="jab" aria-pressed="false">Jab</button>
      <button data-k="cross" aria-pressed="false">Cross</button>
      <button data-k="kick" aria-pressed="false">Kick</button>
    </div>
    <button class="tool on" id="bPlay" aria-pressed="true">Pause</button>
    <button class="tool on" id="bSpin" aria-pressed="true">Rotate</button>
    <button class="tool" id="bReset">Reset</button>
    <span class="spacer"></span>
    <span class="key"><i></i>Gold glove and gold ring: dominant hand and foot</span>
  </div>
</div>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "./OrbitControls.js";
import { GLTFLoader } from "./jsm/GLTFLoader.js";
import * as SkeletonUtils from "./jsm/SkeletonUtils.js";

// ------------------------------------------------------------------ bridge
const send = (type, data = {}) =>
  window.parent.postMessage({ isStreamlitMessage: true, type, ...data }, "*");
let frameHeight = 520;

const COL = { a: "#F04A3E", b: "#A7ADB8", rule: "#E9B44C", skin: "#404047", ink: "#F2F0ED", hit: "#FF6A4D" };
const REDUCE = matchMedia("(prefers-reduced-motion: reduce)").matches;
const V = (x = 0, y = 0, z = 0) => new THREE.Vector3(x, y, z);
const UP = V(0, 1, 0), ZAX = V(0, 0, 1);
const clamp = (x, a, b) => Math.min(Math.max(x, a), b);
const ease = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const easeOut = t => 1 - Math.pow(1 - t, 3);
const cm = m => Math.round(m * 100);
const TXT = c => c;   // both corner colours pass 4.5:1 as text on the stage
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const first = s => String(s).split(" ").slice(-1)[0];
const isYou = F => String(F.info.label || "").trim().toLowerCase() === "you";
const who = F => isYou(F) ? "You" : esc(F.info.label || "Fighter");            // sentence subject
const short_ = F => isYou(F) ? "you" : esc(first(F.info.label || "Fighter"));
const poss = (F, cap = false) => isYou(F) ? (cap ? "Your" : "your") : esc(first(F.info.label || "Fighter")) + "'s";
const possFull = F => isYou(F) ? "Your" : esc(F.info.label || "Fighter") + "'s";
const vb = (F, s3, base) => isYou(F) ? base : s3;

// ------------------------------------------------------------------ renderer / scene
const wrap = document.getElementById("wrap");
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setClearColor(0x000000, 0);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
wrap.prepend(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(30, 1, 0.05, 60);
const controls = new OrbitControls(camera, renderer.domElement);
// keyboard orbit for the canvas (WCAG 2.1.1): arrows turn, +/- zoom
function keyOrbit(el, onKey) {
  el.tabIndex = 0;
  el.addEventListener("keydown", (e) => {
    const sph = new THREE.Spherical().setFromVector3(camera.position.clone().sub(controls.target));
    const step = 0.12;
    if (e.key === "ArrowLeft") sph.theta -= step;
    else if (e.key === "ArrowRight") sph.theta += step;
    else if (e.key === "ArrowUp") sph.phi = Math.max(0.2, sph.phi - step);
    else if (e.key === "ArrowDown") sph.phi = Math.min(controls.maxPolarAngle, sph.phi + step);
    else if (e.key === "+" || e.key === "=") sph.radius = Math.max(controls.minDistance, sph.radius * 0.9);
    else if (e.key === "-") sph.radius = Math.min(controls.maxDistance, sph.radius * 1.1);
    else return;
    e.preventDefault();
    if (onKey) onKey();
    camera.position.copy(controls.target).add(new THREE.Vector3().setFromSpherical(sph));
    controls.update();
  });
}keyOrbit(renderer.domElement, () => { camTween = null; });
renderer.domElement.setAttribute("role", "img");
renderer.domElement.setAttribute("aria-describedby", "kbd");
controls.enableDamping = true;
controls.autoRotateSpeed = 0.7;
controls.minDistance = 1.4;
controls.maxDistance = 14;
controls.maxPolarAngle = Math.PI * 0.52;
controls.autoRotate = !REDUCE;

scene.fog = new THREE.Fog("#0C0C0E", 6.5, 17);
scene.add(new THREE.HemisphereLight("#d6d8de", "#1c1716", 0.7));   // arena rig: neutral light into the shadows
const spot = new THREE.SpotLight("#fff6ee", 6, 0, 0.55, 0.85, 0);
spot.position.set(0.8, 7, 1.4);
spot.target.position.set(0, 0.9, 0);
spot.castShadow = true;
spot.shadow.mapSize.set(2048, 2048);
spot.shadow.bias = -0.0004;
spot.shadow.camera.near = 2; spot.shadow.camera.far = 14;
scene.add(spot, spot.target);
const rimA = new THREE.DirectionalLight("#FF5A48", 2.2); rimA.position.set(-3, 2.4, -4.5); scene.add(rimA);
const rimB = new THREE.DirectionalLight("#FF6A56", 1.5); rimB.position.set(-3, 2.4, 4.5); scene.add(rimB);
const fill = new THREE.DirectionalLight("#b8c4d8", 0.85); fill.position.set(5, 2, 1); scene.add(fill);

// ---- stage: a UFC-size Octagon. 30 ft across the flats, canvas mat, eight padded posts,
// black chain-link fence with a padded top rail, on a dark arena floor
const MAT_R = 3.0;                                    // radius used for camera framing and labels
const OCT_A = 4.57;                                   // apothem: centre to the middle of a fence side (m)
const OCT_R = OCT_A / Math.cos(Math.PI / 8);          // centre to a post
const FENCE_H = 1.75, SKIRT_H = .22;
const octAngle = k => Math.PI / 8 + k * Math.PI / 4;  // post k sits at this angle
const CORNER_POST = { 5: COL.a, 1: "#1F4FD1" };      // red and blue corner posts
const floor = new THREE.Mesh(new THREE.PlaneGeometry(60, 60),
  new THREE.MeshStandardMaterial({ color: "#0a0a0b", roughness: 0.95, metalness: 0 }));
floor.rotation.x = -Math.PI / 2;
floor.receiveShadow = true;
scene.add(floor);
function canvasTexture() {                             // the mat: worn light canvas, dark border by the fence
  const N = 1024, c = document.createElement("canvas"); c.width = c.height = N;
  const g = c.getContext("2d"), px = N / (2 * OCT_R);
  const oct = (r) => { g.beginPath(); for (let k = 0; k < 8; k++) { const a = octAngle(k);
    const x = N / 2 + r * px * Math.cos(a), y = N / 2 - r * px * Math.sin(a); k ? g.lineTo(x, y) : g.moveTo(x, y); } g.closePath(); };
  g.fillStyle = "#1a1a1c"; g.fillRect(0, 0, N, N);
  oct(OCT_R); g.fill();
  g.fillStyle = "#c9c5bc"; oct(OCT_R - .62 / Math.cos(Math.PI / 8)); g.fill();
  g.strokeStyle = "#a31a12"; g.lineWidth = .05 * px; oct(OCT_R - .7 / Math.cos(Math.PI / 8)); g.stroke();
  const img = g.getImageData(0, 0, N, N), d = img.data;   // canvas weave and scuffs
  for (let i = 0; i < d.length; i += 4) {
    const n = (Math.random() - .5) * 14;
    d[i] += n; d[i + 1] += n; d[i + 2] += n;
  }
  g.putImageData(img, 0, 0);
  g.globalAlpha = .05; g.fillStyle = "#3a2f28";
  for (let k = 0; k < 160; k++) { g.beginPath(); g.ellipse(N * Math.random(), N * Math.random(), 4 + 30 * Math.random(), 2 + 10 * Math.random(), Math.PI * Math.random(), 0, 7); g.fill(); }
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return t;
}
const octShape = new THREE.Shape();
for (let k = 0; k <= 8; k++) { const a = octAngle(k); k ? octShape.lineTo(OCT_R * Math.cos(a), OCT_R * Math.sin(a)) : octShape.moveTo(OCT_R * Math.cos(a), OCT_R * Math.sin(a)); }
const matGeo = new THREE.ShapeGeometry(octShape);
{ const uv = matGeo.attributes.uv, P = matGeo.attributes.position;
  for (let i = 0; i < uv.count; i++) uv.setXY(i, P.getX(i) / (2 * OCT_R) + .5, P.getY(i) / (2 * OCT_R) + .5); }
const canvasMat = new THREE.Mesh(matGeo, new THREE.MeshStandardMaterial({ map: canvasTexture(), roughness: .92 }));
canvasMat.rotation.x = -Math.PI / 2;
canvasMat.scale.set(1, -1, 1);                        // keep the shape's +y as the world's -z after the turn
canvasMat.position.y = .003;
canvasMat.receiveShadow = true;
scene.add(canvasMat);
function chainLink() {                                // black vinyl-coated chain link, about 5 cm diamonds
  const c = document.createElement("canvas"); c.width = c.height = 64;
  const g = c.getContext("2d");
  g.strokeStyle = "#fff"; g.lineWidth = 5; g.lineCap = "round";
  g.beginPath(); g.moveTo(0, 32); g.lineTo(32, 0); g.lineTo(64, 32); g.lineTo(32, 64); g.closePath(); g.stroke();
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return t;
}
const side = 2 * OCT_A * Math.tan(Math.PI / 8);
const linkTex = chainLink();
linkTex.repeat.set(side / .055, FENCE_H / .055);
const fenceMat = new THREE.MeshStandardMaterial({ color: "#151517", alphaMap: linkTex, transparent: true,
  roughness: .45, metalness: .3, side: THREE.DoubleSide, depthWrite: false });
const padMat = new THREE.MeshPhysicalMaterial({ color: "#0f0f11", roughness: .38, clearcoat: .5, clearcoatRoughness: .3 });
// cut-away: fence sections between the camera and the centre are hidden, like a broadcast cage cam
const cageParts = [];                                 // { objs, dir }: hide objs when the camera is past dir
function updateCage() {
  const c = camera.position;
  for (const p of cageParts) {
    const show = c.x * p.dir.x + c.z * p.dir.z < OCT_A - .15;
    for (const o of p.objs) o.visible = show;
  }
}
const fenceGeo = new THREE.PlaneGeometry(side, FENCE_H);
const railGeo = new THREE.CylinderGeometry(.085, .085, side, 20);
const skirtGeo = new THREE.BoxGeometry(side, SKIRT_H, .1);
for (let k = 0; k < 8; k++) {
  const a = Math.PI / 4 * (k + 1), mid = V(OCT_A * Math.cos(a), 0, -OCT_A * Math.sin(a));
  const yaw = Math.atan2(mid.x, mid.z);                // each panel faces the centre
  const fence = new THREE.Mesh(fenceGeo, fenceMat);
  fence.position.copy(mid).setY(SKIRT_H + FENCE_H / 2); fence.rotation.y = yaw; fence.renderOrder = 1;
  const rail = new THREE.Mesh(railGeo, padMat);
  rail.position.copy(mid).setY(SKIRT_H + FENCE_H + .06); rail.rotation.set(0, yaw, Math.PI / 2, "YXZ");
  const skirt = new THREE.Mesh(skirtGeo, padMat);
  skirt.position.copy(mid).setY(SKIRT_H / 2); skirt.rotation.y = yaw;
  rail.castShadow = skirt.castShadow = true;
  scene.add(fence, rail, skirt);
  cageParts.push({ objs: [fence, rail, skirt], dir: mid.clone().normalize() });
}
const postGeo = new THREE.CylinderGeometry(.11, .11, SKIRT_H + FENCE_H + .18, 24);
const postTopGeo = new THREE.SphereGeometry(.11, 24, 12, 0, Math.PI * 2, 0, Math.PI / 2);
for (let k = 0; k < 8; k++) {
  const a = octAngle(k), c = CORNER_POST[k];
  const m = c ? new THREE.MeshPhysicalMaterial({ color: c, roughness: .4, clearcoat: .5, clearcoatRoughness: .3 }) : padMat;
  const post = new THREE.Mesh(postGeo, m);
  const h = SKIRT_H + FENCE_H + .18;
  post.position.set(OCT_R * Math.cos(a), h / 2, OCT_R * Math.sin(a));
  const cap = new THREE.Mesh(postTopGeo, m);
  cap.position.set(post.position.x, h, post.position.z);
  post.castShadow = true;
  scene.add(post, cap);
  cageParts.push({ objs: [post, cap], dir: V(Math.cos(a), 0, Math.sin(a)) });
}

// ------------------------------------------------------------------ body model
// fighter.glb: MakeHuman CC0 base mesh shaped into an athletic male, built by
// scripts/build_body_model.py. Proportions below are measured from its skeleton once it loads.
const ANAT = { crotch: .47, crotchZ: .005, hipX: .052, hipUp: .035, hipZ: .005, sj: .1, shUp: .345, shZ: 0,
               neckUp: .356, neckZ: 0, headBoneUp: .405, headBoneZ: .004, headUp: .058, headZ: .01,
               ankle: .045, thigh: .225, shin: .235, upper: .176, fore: .144, hand: .08 };
let MODEL = null;
const nm = s => s.replace(/\./g, "");            // GLTFLoader strips dots from node names

function buildModel(gltf) {
  const root = gltf.scene, ext = gltf.parser.json.extras;
  root.updateMatrixWorld(true);
  const Hm = ext.height, y0 = ext.floor;
  const bone = n => root.getObjectByName(nm(n));
  const wp = n => V().setFromMatrixPosition(bone(n).matrixWorld);
  const mid = (a, b) => wp(a).add(wp(b)).multiplyScalar(.5);
  const hip = mid("upperleg01.L", "upperleg01.R"), sh = mid("upperarm01.L", "upperarm01.R");
  const neck = wp("neck01"), headB = wp("head");
  const eyes = V(...ext.eyes.L).add(V(...ext.eyes.R)).multiplyScalar(.5);
  const headC = eyes.clone().add(V(0, .004, -.078));
  ANAT.hipUp = .035;
  ANAT.crotch = (hip.y - y0) / Hm - ANAT.hipUp;
  ANAT.crotchZ = hip.z / Hm - .005;
  ANAT.hipX = (wp("upperleg01.L").x - wp("upperleg01.R").x) / 2 / Hm;
  const up = v => (v.y - y0) / Hm - ANAT.crotch, fz = v => v.z / Hm - ANAT.crotchZ;
  ANAT.sj = (wp("upperarm01.L").x - wp("upperarm01.R").x) / 2 / Hm;
  ANAT.shUp = up(sh); ANAT.shZ = fz(sh);
  ANAT.neckUp = up(neck); ANAT.neckZ = fz(neck);
  ANAT.headBoneUp = up(headB); ANAT.headBoneZ = fz(headB);
  ANAT.headUp = (headC.y - headB.y) / Hm; ANAT.headZ = (headC.z - headB.z) / Hm;
  ANAT.ankle = (wp("foot.L").y - y0) / Hm;
  ANAT.thigh = wp("upperleg01.L").distanceTo(wp("lowerleg01.L")) / Hm;
  ANAT.shin = wp("lowerleg01.L").distanceTo(wp("foot.L")) / Hm;
  ANAT.upper = wp("upperarm01.L").distanceTo(wp("lowerarm01.L")) / Hm;
  ANAT.fore = wp("lowerarm01.L").distanceTo(wp("wrist.L")) / Hm;
  ANAT.hand = ext.fist.L / Hm;
  const order = [], parentOf = {}, restLocal = {}, restWorld = {}, restPos = {};
  root.traverse(o => {
    if (!o.isBone) return;
    order.push(o.name);
    parentOf[o.name] = o.parent && o.parent.isBone ? o.parent.name : null;
    restLocal[o.name] = o.quaternion.clone();
    restPos[o.name] = o.position.clone();
    restWorld[o.name] = new THREE.Quaternion().setFromRotationMatrix(new THREE.Matrix4().extractRotation(o.matrixWorld));
  });
  const hand = {};
  for (const s of ["L", "R"]) {
    const w = bone("wrist." + s);
    const f0 = V(0, 1, 0).applyQuaternion(restWorld[w.name]);
    const b0 = V(...w.userData.palm).negate();
    b0.addScaledVector(f0, -b0.dot(f0)).normalize();
    hand[s] = new THREE.Quaternion().setFromRotationMatrix(new THREE.Matrix4().makeBasis(b0.clone().cross(f0), b0, f0));
  }
  const headInv = new THREE.Matrix4().copy(bone("head").matrixWorld).invert();
  fightKit(root);
  muscleShading(root);
  return { scene: root, Hm, floor: y0, order, parentOf, restLocal, restWorld, restPos, hand,
           restRoot: wp("root"), restHip: hip,
           eyeLocal: ["L", "R"].map(s => V(...ext.eyes[s]).applyMatrix4(headInv)) };
}

// ------------------------------------------------------------------ fight kit
// UFC-style kit drawn from per-vertex data computed once from the bind pose (the mesh has no UVs):
// tight black fight shorts with corner-colour side panels, hem band and white piping;
// wrist straps with white piping along their edges.
function openEdges(g) {
  const ix = g.index.array, count = new Map(), nb = new Map();
  const key = (a, b) => a < b ? a * 1e6 + b : b * 1e6 + a;
  for (let i = 0; i < ix.length; i += 3)
    for (const [a, b] of [[ix[i], ix[i + 1]], [ix[i + 1], ix[i + 2]], [ix[i + 2], ix[i]]])
      count.set(key(a, b), (count.get(key(a, b)) || 0) + 1);

// ------------------------------------------------------------------ camera framing
function frameFor(m) {
  const n = fighters.length;

  const maxR = Math.max(...fighters.map(f => f.target.R));

    az = n > 1 ? .34 : 1.05; el = .14;

const clock = new THREE.Clock();

  const ribs = toLocal(F, w(OJ.crotch.clone().add(V(0, .19 * H, .065 * H).applyQuaternion(oQ))));

  const calf = toLocal(F, w(OJ.knee[ol].clone().lerp(OJ.ankle[ol], .38).add(V(ol * .04 * H, 0, 0))));

  });

  // 4. reactions decay toward rest
  fighters.forEach(F => {
    const sinceHead = time - (F.hitHeadT ?? -9), sinceBody = time - (F.hitBodyT ?? -9);
    const hr = sinceHead >= 0 && sinceHead < .25 ? .025 * F.p.H : 0;
    const br = sinceBody >= 0 && sinceBody < .3 ? (F.hitSide || 1) * .03 * F.p.H : 0;
    F.recoil += (hr - F.recoil) * Math.min(dt * 18, 1);
    F.flinch += (br - F.flinch) * Math.min(dt * 14, 1);
    if (F.kdT >= 0) { F.kdT += dt; if (F.kdT > 2.0) F.kdT = -1; }
    const kt = F.kdT;
    F.kd = kt < 0 ? 0 : kt < .3 ? easeOut(kt / .3) : kt < 1.3 ? 1 : 1 - ease(clamp((kt - 1.3) / .7, 0, 1));
  });
  stepFlashes(dt);

  if (camTween) {
    camTween.t = Math.min(camTween.t + dt / .9, 1);
    const e = ease(camTween.t);
    camera.position.lerpVectors(camTween.p0, camTween.p1, e);
    controls.target.lerpVectors(camTween.t0, camTween.t1, e);
    if (camTween.t >= 1) camTween = null;
  }
  controls.update(dt);
  updateCage();
  renderer.render(scene, camera);
  annotate(fo, st, k);
}
if (CAPTURE) {
  window.__step = (dt, steps = 1) => { for (let q = 0; q < steps; q++) frame(dt); return time; };
  window.__cam = (pos, tgt) => { camTween = null; camera.position.set(...pos); controls.target.set(...tgt); controls.update(); };
  window.__anat = () => ({ ...ANAT });
  window.__dbg = () => { const b = MODEL.scene.getObjectByName("body"), a = b.geometry.attributes.ao;
    const F = fighters[0], m = F && F.parts && F.parts.body && F.parts.body.material;
    return { hasAO: !!a, ao: a ? [Math.min(...a.array), Math.max(...a.array), a.array.filter(x => x < .9).length, a.count] : null,
             mat: m && m.type, isSkin: m === (F && F.mats.skin), key: m && m.customProgramCacheKey && m.customProgramCacheKey() }; };
  window.__plan = () => PLAN && PLAN.ev.map(e => ({ kind: e.kind, m: e.m, who: e.who, t0: e.t0, dur: e.dur, combo: e.combo }));
  window.__set = (o) => {
    if (o.strike) setStrike(o.strike === "combo" ? "spar" : o.strike);
    if (o.mode) setMode(o.mode);
    if (o.spin !== undefined) { controls.autoRotate = o.spin; syncSpin(); }
    if (o.speed) controls.autoRotateSpeed = o.speed;
    if (o.time !== undefined) time = o.time;
    if (o.figures) window.postMessage({ type: "streamlit:render",
      args: { height: window.innerHeight, figures: o.figures } }, "*");
    if (o.clearFlashes) { for (const f of flashes) scene.remove(f.m); flashes.length = 0; }
  };
} else {
  renderer.setAnimationLoop(() => frame());
}

function annotate(fo, env, k) {
  const n = fighters.length;
  if (!n) { endLabels(); endSegs(); return; }
  const ready = k > .85;
  const name = F => esc(F.info.label || "Fighter");
  const H = F => F.p.H;
  let html = "", table = "";

  if (mode === "face") {
    const active = fighters.map((F, i) => {
      const o = env.out[i];
      let best = null;
      for (const ev of o.events) if (ev.a > .3 && (!best || ev.a > best.a)) best = ev;
      return best ? best.e.m : null;
    });
    const lands = g => g < .015;
    const cell = g => lands(g) ? `<td class="ok">Lands</td>` : `<td class="no">${cm(g)} cm short</td>`;
    const rowOn = key => active.some(x => x === key || (key === "ek" && x === "elk")) ? ` class="on"` : "";
    if (n > 1) {
      const [A, B] = fighters;
      const gA = fo.res[0].gap, gB = fo.res[1].gap;
      const longA = gB.ej >= gA.ej;
      const L = longA ? A : B, S = longA ? B : A;
      const gap = cm(Math.max(gA.ej, gB.ej, 0));
      html = gap < 2
        ? `Even range<span>From jabbing distance both lead hands reach the other's face. The table measures every strike from that spot.</span>`
        : `${who(L)} ${vb(L, "owns", "own")} the range<span>At the distance where ${poss(L)} jab just lands, ${isYou(S) ? "yours" : poss(S)} falls ${gap} cm short. The table measures every strike from that spot.</span>`;
      table = `<table class="rt"><tr><th></th><th style="color:${TXT(A.corner)}">${esc(first(A.info.label || "A"))}</th><th style="color:${TXT(B.corner)}">${esc(first(B.info.label || "B"))}</th></tr>` +
        ["ej", "ec", "ek"].map(key => `<tr${rowOn(key)}><td>${STRIKES[key]}</td>${cell(gA[key])}${cell(gB[key])}</tr>`).join("") + `</table>`;
      const tops = fighters.map(F => solve(F.p, "guard", {}).head.clone()
        .applyMatrix4(F.group.matrixWorld).add(V(0, .16, 0)));
      const sx = tops.map(t => t.clone().project(camera).x);
      fighters.forEach((F, i) => {
        const leftSide = sx[i] < sx[1 - i];
        putLabel("tag" + i, "tag", tops[i], `${name(F)}<small>${esc(F.info.stance || "")}, ${esc((F.info.hand || "").toLowerCase())}-handed</small>`,
          { color: TXT(F.corner), ax: leftSide ? -1 : 0, dx: leftSide ? 18 : -18, op: ready ? 1 : 0 });
      });
    } else {
      const F = fighters[0];
      const leadSide = leadOf(F.p);
      const power = F.hand === leadSide ? "Power hand leads, so the jab is the best weapon."
                                         : "Power hand sits at the back for the cross and the hook.";
      html = `${isYou(F) ? "Your" : possFull(F)} ${esc((F.info.stance || "orthodox").toLowerCase())} stance<span>${power} The arc on the mat is jab range.</span>`;
      table = `<table class="rt"><tr><th></th><th style="color:${TXT(F.corner)}">vs same size</th></tr>` +
        ["ej", "ec", "ek"].map(key => `<tr${rowOn(key)}><td>${STRIKES[key]}</td>${cell(fo.res[0].gap[key])}</tr>`).join("") + `</table>`;
      const J = solve(F.p, "guard", {});
      putLabel("tag0", "tag", J.head.clone().applyMatrix4(F.group.matrixWorld).add(V(0, .16, 0)),
        `${name(F)}`, { color: TXT(F.corner), op: ready ? 1 : 0 });
    }
    fighters.forEach((F, i) => {
      if (F.kd > .4 && F.J) putLabel("kd" + i, "chip", F.J.head.clone().applyMatrix4(F.group.matrixWorld).add(V(0, .22, 0)),
        "Knockdown", { color: COL.a, op: clamp((F.kd - .4) * 2.5, 0, 1) });
    });
    // what each strike did, shown at the fist or foot as it arrives
    fighters.forEach((F, i) => {
      for (const [id, c] of Object.entries(F.chips || {})) {
        const age = time - (c.until - .7);
        if (age < 0 || age > .7) continue;
        const pos = c.tipLocal.clone().applyMatrix4(F.group.matrixWorld).add(V(0, -.07, 0));
        putLabel("hit" + i + id, "chip", pos, c.text, { color: c.color, ay: 0, op: clamp(1 - (age - .45) / .25, 0, 1) });
      }
      // combo name above the attacker while it runs
      const ev = env.out[i].events.find(x => x.e.combo);
      if (ev && PLAN.spar) {
        const top = F.J.head.clone().applyMatrix4(F.group.matrixWorld).add(V(0, .34, 0));
        putLabel("combo" + i, "chip", top, esc(ev.e.combo), { color: TXT(F.corner), op: 1 });
      }
    });
  }

  if (mode === "tape") {
    const xs = fighters.map(F => F.group.position.x);
    const x0 = Math.min(...xs) - .42, x1 = Math.max(...xs) + .42;
    fighters.forEach((F, i) => {
      const y = H(F);
      line("h" + i, V(x0, y, -.12), V(x1, y, -.12), F.corner, true, .9);
      const below = n > 1 && i === (H(fighters[0]) >= H(fighters[1]) ? 1 : 0);
      putLabel("hv" + i, "val", V(x1 + .03, y, -.12), `${cm(y)} cm`,
        { color: TXT(F.corner), ax: 0, ay: -.5, dy: below ? 9 : -9, op: ready ? 1 : 0 });
      putLabel("tag" + i, "tag", V(F.group.position.x, -.02, .1), `${name(F)}<small>${Math.round(F.target.W)} kg, ape index ${fmtSigned(cm(F.p.R - F.p.H))} cm</small>`,
        { color: TXT(F.corner), ay: 0, op: ready ? 1 : 0 });
    });
    if (n > 1) {
      const [A, B] = fighters;
      const dh = cm(A.p.H - B.p.H), dw = Math.round(A.target.W - B.target.W);
      const T = dh >= 0 ? A : B, S = dh >= 0 ? B : A;
      html = Math.abs(dh) < 1
        ? `Same height<span>${weightLine(A, B, dw)}</span>`
        : `${who(T)} ${vb(T, "stands", "stand")} ${Math.abs(dh)} cm taller<span>${weightLine(A, B, dw)}</span>`;
      line("dh", V(x1 - .05, A.p.H, -.12), V(x1 - .05, B.p.H, -.12), COL.rule);
    } else {
      const F = fighters[0];
      html = `${cm(F.p.H)} cm, ${Math.round(F.target.W)} kg<span>BMI ${(F.target.W / (F.p.H * F.p.H)).toFixed(1)}. The body model widens with weight relative to height.</span>`;
    }
  }

  if (mode === "reach") {
    const top = Math.max(...fighters.map(H));
    fighters.forEach((F, i) => {
      const y = top + .1 + .17 * i, half = F.p.R / 2;
      const shY = .815 * F.p.H - .004 * F.p.H;
      line("r" + i, V(-half, y, 0), V(half, y, 0), F.corner);
      line("rl" + i, V(-half, y + .025, 0), V(-half, y - .025, 0), F.corner);
      line("rr" + i, V(half, y + .025, 0), V(half, y - .025, 0), F.corner);
      line("dl" + i, V(-half, y, 0), V(-half, shY, 0), F.corner, true, .7);
      line("dr" + i, V(half, y, 0), V(half, shY, 0), F.corner, true, .7);
      putLabel("rv" + i, "val", V(0, y, 0), `${n > 1 ? name(F) + " " : "Reach "}${cm(F.p.R)} cm`,
        { color: TXT(F.corner), ay: -1, dy: -4, op: ready ? 1 : 0 });
    });
    if (n > 1) {
      const [A, B] = fighters;
      const dr = cm(A.p.R - B.p.R);
      const Lf = dr >= 0 ? A : B;
      html = Math.abs(dr) < 1
        ? `Matching arm span<span>Ape index (reach minus height): ${apeLine(A)}, ${apeLine(B)}.</span>`
        : `${possFull(Lf)} arms span ${Math.abs(dr)} cm wider<span>Ape index (reach minus height): ${apeLine(A)}, ${apeLine(B)}. The translucent figure is ${isYou(B) ? "you" : esc(B.info.label || "corner B")}.</span>`;
    } else {
      const F = fighters[0];
      const ape = cm(F.p.R - F.p.H);
      const x = F.p.R / 2 + .14;
      line("hgt", V(x, 0, 0), V(x, F.p.H, 0), COL.rule);
      line("hgt2", V(x - .025, F.p.H, 0), V(x + .025, F.p.H, 0), COL.rule);
      putLabel("hgtv", "val", V(x + .03, F.p.H * .5, 0), `Height ${cm(F.p.H)} cm`,
        { color: COL.rule, ax: 0, ay: -.5, op: ready ? 1 : 0 });
      html = `Reach ${cm(F.p.R)} cm<span>Ape index ${fmtSigned(ape)} cm: arms ${ape >= 4 ? "longer than" : ape <= -4 ? "shorter than" : "about the same as"} height${ape >= 4 ? ", an edge at range" : ""}.</span>`;
    }
  }
  if (html !== headHTML) { head.innerHTML = html; headHTML = html;
    renderer.domElement.setAttribute("aria-label", "3D comparison. " + head.textContent); }
  if (table !== tableHTML) { rangeEl.innerHTML = table; tableHTML = table; }
  endLabels(); endSegs();
}
const fmtSigned = v => (v > 0 ? "+" : v < 0 ? "−" : "") + Math.abs(v);
const apeLine = F => `${short_(F)} ${fmtSigned(cm(F.p.R - F.p.H))} cm`;
const weightLine = (A, B, dw) => Math.abs(dw) < 1
  ? "Same weight on the scale."
  : (F => `${isYou(F) ? "You carry" : short_(F) + " carries"} ${Math.abs(dw)} kg more.`)(dw > 0 ? A : B);

// ------------------------------------------------------------------ UI
const btn = { face: document.getElementById("mFace"), tape: document.getElementById("mTape"),
              reach: document.getElementById("mReach") };
function setMode(m) {
  if (m === mode) return;
  prevMode = mode; mode = m; modeT = 0;
  for (const [key, b] of Object.entries(btn)) { b.classList.toggle("on", key === m); b.setAttribute("aria-pressed", String(key === m)); }
  document.getElementById("strikes").style.display = m === "face" ? "" : "none";
  flyTo(m);
}
function clearKD() { for (const F of fighters) { F.kdT = -1; F.kd = 0; } }
function setStrike(k) {
  clearKD();
  strikeSel = k;
  for (const b of document.querySelectorAll("#strikes button")) { b.classList.toggle("on", b.dataset.k === k); b.setAttribute("aria-pressed", String(b.dataset.k === k)); }
}
for (const b of document.querySelectorAll("#strikes button")) b.onclick = () => { setStrike(b.dataset.k); time = 0; if (paused) { paused = false; syncPlay(); } };
btn.face.onclick = () => setMode("face");
btn.tape.onclick = () => setMode("tape");
btn.reach.onclick = () => setMode("reach");
const bSpin = document.getElementById("bSpin");
const syncSpin = () => { bSpin.classList.toggle("on", controls.autoRotate); bSpin.setAttribute("aria-pressed", String(controls.autoRotate)); };
const bPlay = document.getElementById("bPlay");
const syncPlay = () => { bPlay.textContent = paused ? "Play" : "Pause"; bPlay.classList.toggle("on", !paused); bPlay.setAttribute("aria-pressed", String(!paused)); bPlay.setAttribute("aria-label", paused ? "Play the strikes" : "Pause the strikes"); };
bPlay.onclick = () => { paused = !paused; if (paused) controls.autoRotate = false; syncSpin(); syncPlay(); };
syncPlay();
bSpin.onclick = () => { controls.autoRotate = !controls.autoRotate; syncSpin(); };
document.getElementById("bReset").onclick = () => flyTo(mode);
controls.addEventListener("start", () => { camTween = null; });

function resize() {
  const w = wrap.clientWidth, h = wrap.clientHeight;
  if (!w || !h) return;
  renderer.setSize(w, h, false);
  renderer.domElement.style.width = w + "px";
  renderer.domElement.style.height = h + "px";
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
new ResizeObserver(() => { resize(); }).observe(wrap);

// ------------------------------------------------------------------ inputs
window.addEventListener("message", (e) => {
  const d = e.data;
  if (!d || d.type !== "streamlit:render") return;
  const args = d.args || {};
  frameHeight = args.height || 520;
  wrap.style.height = frameHeight + "px";
  send("streamlit:setFrameHeight", { height: frameHeight });
  figs = args.figures || [];
  const countChanged = figs.length !== fighters.length;
  syncFighters();
  resize();
  if (firstRender) {
    const p = args.pose;
    const m = p === "tpose" || p === "reach" ? "reach" : p === "stand" || p === "tape" ? "tape" : "face";
    mode = prevMode = m;
    for (const [key, b] of Object.entries(btn)) b.classList.toggle("on", key === m);
    document.getElementById("strikes").style.display = m === "face" ? "" : "none";
    if (args.strike && ["spar", "jab", "cross", "kick"].includes(args.strike)) setStrike(args.strike);
    if (args.autorotate === false || REDUCE) controls.autoRotate = false;
    syncSpin();
    flyTo(mode, true);
    firstRender = false;
  } else if (countChanged) {
    flyTo(mode);
  }
});

if (window.parent === window) {
  const demo = location.hash ? JSON.parse(decodeURIComponent(location.hash.slice(1))) : {
    figures: [
      { label: "Conor McGregor", height_cm: 175, weight_kg: 70, reach_cm: 188, stance: "Southpaw", hand: "Right", foot: "Right" },
      { label: "Khabib Nurmagomedov", height_cm: 178, weight_kg: 70, reach_cm: 178, stance: "Orthodox", hand: "Right", foot: "Left", ghost: true }] };
  window.postMessage({ type: "streamlit:render", args: { height: window.innerHeight, ...demo } }, "*");
} else {
  send("streamlit:componentReady", { apiVersion: 1 });
}
</script>
</body>
