<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Body 3D</title>
<style>
  @font-face { font-family: "Instrument Sans"; src: url("/app/static/fonts/instrument-sans-latin-400-normal.woff2") format("woff2"); font-weight: 400; }
  @font-face { font-family: "Instrument Sans"; src: url("/app/static/fonts/instrument-sans-latin-600-normal.woff2") format("woff2"); font-weight: 600; }
  @font-face { font-family: "Big Shoulders Display"; src: url("/app/static/fonts/big-shoulders-display-latin-700-normal.woff2") format("woff2"); font-weight: 700; }
  @font-face { font-family: "Big Shoulders Display"; src: url("/app/static/fonts/big-shoulders-display-latin-800-normal.woff2") format("woff2"); font-weight: 800; }
  :root { --bg:#0E0A17; --ink:#EFEAF6; --ink2:#BDB4D2; --mute:#8A81A3; --line:#2B2242;
          --a:#C862CE; --b:#5A54D8; --rule:#E4C49B; }
  html, body { margin:0; height:100%; background:var(--bg); overflow:hidden; color:var(--ink);
               font-family:"Instrument Sans", "Segoe UI", system-ui, sans-serif; }
  #wrap { position:relative; width:100%; height:100%; overflow:hidden; box-sizing:border-box;
          border:1px solid var(--line); border-radius:6px;
          background: radial-gradient(110% 75% at 50% 100%, #2A1D45 0%, #160F27 48%, #0E0A17 80%); }
  canvas { display:block; position:absolute; inset:0; }
  #labels { position:absolute; inset:0; pointer-events:none; overflow:hidden; }
  .lab { position:absolute; left:0; top:0; white-space:nowrap; will-change:transform; transition:opacity .2s; }
  .tag.l { text-align:right; }
  .tag { font-family:"Big Shoulders Display", sans-serif; font-weight:700; font-size:17px; line-height:1;
         text-align:center; text-shadow:0 1px 10px rgba(0,0,0,.8); }
  .tag small { display:block; font-family:"Instrument Sans", sans-serif; font-weight:400; font-size:11.5px;
               color:var(--ink2); margin-top:3px; }
  .chip { font-size:12px; font-weight:600; padding:3px 8px; border-radius:3px; line-height:1.2;
          background:rgba(14,10,23,.88); border:1px solid currentColor; }
  .val { font-family:"Big Shoulders Display", sans-serif; font-weight:700; font-size:15px;
         text-shadow:0 1px 8px rgba(0,0,0,.8); }
  .hud { position:absolute; top:12px; left:14px; right:14px; pointer-events:none; }
  .head { font-family:"Big Shoulders Display", sans-serif; font-weight:800; font-size:23px; line-height:1.05;
          max-width:560px; text-wrap:balance; }
  .head span { display:block; font-family:"Instrument Sans", sans-serif; font-weight:400; font-size:12.5px;
               line-height:1.4; color:var(--ink2); margin-top:5px; max-width:460px; }
  .bar { position:absolute; left:12px; right:12px; bottom:12px; display:flex; align-items:center;
         gap:10px; flex-wrap:wrap; }
  .seg { display:inline-flex; border:1px solid var(--line); border-radius:4px; overflow:hidden;
         background:rgba(21,16,36,.9); }
  .seg button, .tool { all:unset; cursor:pointer; font-size:12.5px; padding:6px 12px; color:var(--ink2); }
  .seg button + button { border-left:1px solid var(--line); }
  .seg button.on { background:var(--a); color:#fff; }
  .tool { padding:6px 10px; color:var(--ink2); background:rgba(21,16,36,.9); border:1px solid var(--line); border-radius:4px; }
  .tool.on { color:var(--ink); border-color:#4A3B70; }
  .seg button:focus-visible, .tool:focus-visible { outline:2px solid var(--rule); outline-offset:-2px; }
  .spacer { flex:1; }
  .key { font-size:11.5px; color:var(--ink2); }
  .key i { display:inline-block; width:14px; height:4px; border-radius:2px; margin-right:6px;
           vertical-align:middle; background:var(--rule); box-shadow:0 0 6px var(--rule); }
  @media (max-width: 520px) { .key { display:none; } .head { font-size:20px; } }
</style>
<script type="importmap">
  { "imports": { "three": "./three.module.min.js" } }
</script>
</head>
<body>
<div id="wrap">
  <div id="labels"></div>
  <div class="hud"><div class="head" id="head"></div></div>
  <div class="bar">
    <div class="seg" role="group" aria-label="View">
      <button id="mFace" class="on">Face-off</button>
      <button id="mTape">Height</button>
      <button id="mReach">Reach</button>
    </div>
    <button class="tool on" id="bSpin">Rotate</button>
    <button class="tool" id="bReset">Reset view</button>
    <span class="spacer"></span>
    <span class="key"><i></i>Gold band marks the dominant hand and foot</span>
  </div>
</div>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "./OrbitControls.js";

// ------------------------------------------------------------------ bridge
const send = (type, data = {}) =>
  window.parent.postMessage({ isStreamlitMessage: true, type, ...data }, "*");
let frameHeight = 520;

const COL = { a: "#C862CE", b: "#5A54D8", rule: "#E4C49B", skin: "#CDC4DC", ink: "#EFEAF6" };
const REDUCE = matchMedia("(prefers-reduced-motion: reduce)").matches;
const V = (x = 0, y = 0, z = 0) => new THREE.Vector3(x, y, z);
const UP = V(0, 1, 0), ZAX = V(0, 0, 1);
const clamp = (x, a, b) => Math.min(Math.max(x, a), b);
const ease = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const easeOut = t => 1 - Math.pow(1 - t, 3);
const cm = m => Math.round(m * 100);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const first = s => String(s).split(" ").slice(-1)[0];
const isYou = F => String(F.info.label || "").trim().toLowerCase() === "you";
const who = F => isYou(F) ? "You" : esc(F.info.label || "Fighter");            // sentence subject
const short_ = F => isYou(F) ? "you" : esc(first(F.info.label || "Fighter"));
const poss = (F, cap = false) => isYou(F) ? (cap ? "Your" : "your") : esc(first(F.info.label || "Fighter")) + "'s";
const possFull = F => isYou(F) ? "Your" : esc(F.info.label || "Fighter") + "'s";
const vb = (F, s3, base) => isYou(F) ? base : s3;

// ------------------------------------------------------------------ renderer / scene
const wrap = document.getElementById("wrap");
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setClearColor(0x000000, 0);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
wrap.prepend(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(30, 1, 0.05, 60);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.autoRotateSpeed = 0.7;
controls.minDistance = 1.4;
controls.maxDistance = 14;
controls.maxPolarAngle = Math.PI * 0.52;
controls.autoRotate = !REDUCE;

scene.add(new THREE.HemisphereLight("#d8ccff", "#120c20", 0.7));
const spot = new THREE.SpotLight("#fff3e6", 5.5, 0, 0.55, 0.85, 0);
spot.position.set(0.8, 7, 1.4);
spot.target.position.set(0, 0.9, 0);
spot.castShadow = true;
spot.shadow.mapSize.set(2048, 2048);
spot.shadow.bias = -0.0004;
spot.shadow.camera.near = 2; spot.shadow.camera.far = 14;
scene.add(spot, spot.target);
const rimA = new THREE.DirectionalLight(COL.a, 2.4); rimA.position.set(-3, 2.6, -4.5); scene.add(rimA);
const rimB = new THREE.DirectionalLight(COL.b, 3.0); rimB.position.set(-3, 2.6, 4.5); scene.add(rimB);
const fill = new THREE.DirectionalLight("#c8bcff", 0.45); fill.position.set(5, 2, 1); scene.add(fill);

// ---- octagon mat
const MAT_R = 3.0;
const floor = new THREE.Mesh(new THREE.CircleGeometry(MAT_R, 8),
  new THREE.MeshStandardMaterial({ color: "#1B1430", roughness: 0.95 }));
floor.rotation.x = -Math.PI / 2;
floor.rotation.z = Math.PI / 8;
floor.receiveShadow = true;
scene.add(floor);
function octLoop(r, color, opacity = 1) {
  const pts = [];
  for (let k = 0; k <= 8; k++) {
    const a = Math.PI / 8 + k * Math.PI / 4;
    pts.push(V(r * Math.cos(a), 0.003, r * Math.sin(a)));
  }
  return new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),
    new THREE.LineBasicMaterial({ color, transparent: true, opacity }));
}
scene.add(octLoop(MAT_R, "#4A3B70"), octLoop(MAT_R - 0.06, "#2B2242"), octLoop(1.25, "#2B2242", 0.7));
const postGeo = new THREE.CylinderGeometry(0.06, 0.06, 0.26, 16);
for (let k = 0; k < 8; k++) {
  const a = Math.PI / 8 + k * Math.PI / 4;
  const isA = k === 5, isB = k === 1;
  const c = isA ? COL.a : isB ? COL.b : "#2B2242";
  const post = new THREE.Mesh(postGeo, new THREE.MeshStandardMaterial({
    color: c, roughness: 0.5, emissive: c, emissiveIntensity: isA || isB ? 0.9 : 0.05 }));
  post.position.set(MAT_R * Math.cos(a), 0.13, MAT_R * Math.sin(a));
  scene.add(post);
}

// ------------------------------------------------------------------ geometry library
function lathe(profile, seg = 32, n = 28) {
  const curve = new THREE.SplineCurve(profile.map(([r, y]) => new THREE.Vector2(r, y)));
  const pts = curve.getPoints(n).map(v => new THREE.Vector2(Math.max(v.x, 1e-3), v.y));
  return new THREE.LatheGeometry(pts, seg);
}
const G = {
  upper: lathe([[.82, 0], [.93, .12], [1, .38], [.95, .6], [.8, .84], [.7, 1]]),
  fore:  lathe([[.76, 0], [.95, .14], [1, .3], [.84, .6], [.66, .88], [.6, 1]]),
  thigh: lathe([[1, 0], [1, .16], [.96, .42], [.85, .7], [.7, .92], [.64, 1]]),
  shin:  lathe([[.7, 0], [.9, .12], [1, .27], [.85, .52], [.6, .8], [.5, 1]]),
  sleeve: lathe([[1.0, 0], [1.02, .5], [.98, 1]], 32, 8),
  sphere: new THREE.SphereGeometry(1, 40, 28),
  cyl: new THREE.CylinderGeometry(1, 1, 1, 28, 1).translate(0, 0.5, 0),
};
function torsoProfile(g) {
  const s = Math.sqrt(g), w = Math.pow(g, 1.3), c = .86 + .14 * g;
  return [[.02, 0], [.064 * s, .012], [.082 * s, .035], [.085 * s, .066], [.081 * w, .1],
          [.079 * w, .14], [.081 * w, .17], [.093 * c, .21], [.11 * c, .25], [.118 * c, .285],
          [.116 * c, .315], [.098 * c, .337], [.06, .356], [.034, .372]];
}
function shortsProfile(g) {
  const s = Math.sqrt(g), w = Math.pow(g, 1.3), k = 1.07;
  return [[.05 * s * k, -.004], [.072 * s * k, .012], [.087 * s * k, .035], [.09 * s * k, .066],
          [.086 * w * k, .1], [.084 * w * k, .135]];
}

// ------------------------------------------------------------------ fighter
const LEFT = 1, RIGHT = -1;          // +x is the fighter's own left side
const sideOf = s => (s === "Left" ? LEFT : RIGHT);

function params(f) {
  const H = clamp((f.height_cm || 175) / 100, 1.4, 2.2);
  const R = clamp((f.reach_cm || f.height_cm || 175) / 100, 1.3, 2.4);
  const W = clamp(f.weight_kg || 70, 40, 150);
  return { H, R, W, g: clamp(Math.sqrt(W / (H * H) / 23), 0.82, 1.42),
           lead: f.stance === "Southpaw" ? RIGHT : LEFT };
}

function dims(p) {
  const H = p.H;
  const sj = .1 * H * (.93 + .07 * p.g);
  const arm = Math.max(p.R / 2 - sj, .3 * H);
  return { H, sj, arm, upper: .44 * arm, fore: .36 * arm, hand: .2 * arm,
           thigh: .225 * H, shin: .235 * H, headR: .062 * H, rg: .04 * H * (.95 + .05 * p.g) };
}

function ik(a, target, l1, l2, pole) {
  const d = target.clone().sub(a);
  const dist = clamp(d.length(), 1e-4, (l1 + l2) * 0.9995);
  const dir = d.normalize();
  const end = a.clone().addScaledVector(dir, dist);
  const x = (l1 * l1 - l2 * l2 + dist * dist) / (2 * dist);
  const h = Math.sqrt(Math.max(l1 * l1 - x * x, 0));
  const perp = pole.clone().addScaledVector(dir, -pole.dot(dir));
  if (perp.lengthSq() < 1e-8) perp.set(0, 0, -1);
  perp.normalize();
  return { joint: a.clone().addScaledVector(dir, x).addScaledVector(perp, h), end };
}

// Pose solver: returns joint positions in the fighter's local frame (faces +z).
function solve(p, mode, o = {}) {
  const d = dims(p), H = d.H, s = p.lead;
  const t = o.t || 0, jab = o.jab || 0;
  const J = { d };
  let drop, yaw, lean, feet;
  if (mode === "guard") {
    const bounce = REDUCE ? 0 : Math.sin(t * Math.PI * 2 * 1.5) * .007 * H;
    drop = .055 * H + bounce + .012 * H * jab;
    yaw = -s * (.52 + .2 * jab);
    lean = .11 + .06 * jab;
    feet = {
      [LEFT]:  s === LEFT ? [V(.062 * H, 0, .17 * H), -.2] : [V(.088 * H, 0, -.15 * H), .8],
      [RIGHT]: s === LEFT ? [V(-.088 * H, 0, -.15 * H), -.8] : [V(-.062 * H, 0, .17 * H), .2],
    };
    // continuous stance switch (s is lerped between -1 and +1)
    const wl = (1 + s) / 2;
    feet[LEFT] = [V(.062 * H, 0, .17 * H).lerp(V(.088 * H, 0, -.15 * H), 1 - wl), -.2 * wl + .8 * (1 - wl)];
    feet[RIGHT] = [V(-.088 * H, 0, -.15 * H).lerp(V(-.062 * H, 0, .17 * H), 1 - wl), -.8 * wl + .2 * (1 - wl)];
    yaw = -(2 * wl - 1) * (.52 + .2 * jab);
  } else {
    const breathe = REDUCE ? 0 : Math.sin(t * Math.PI * 2 * .25) * .002 * H;
    drop = .004 * H + breathe; yaw = 0; lean = .02;
    feet = { [LEFT]: [V(.07 * H, 0, .01 * H), .14], [RIGHT]: [V(-.07 * H, 0, .01 * H), -.14] };
  }
  const Q = new THREE.Quaternion().setFromEuler(new THREE.Euler(lean, yaw, 0, "YXZ"));
  const crotch = V(0, .47 * H - drop, .005 * H);
  const T = (x, y, z) => V(x, y, z).applyQuaternion(Q).add(crotch);
  J.Q = Q; J.crotch = crotch;
  J.hip = { [LEFT]: T(.052 * Math.sqrt(p.g) * H, .035 * H, .005 * H),
            [RIGHT]: T(-.052 * Math.sqrt(p.g) * H, .035 * H, .005 * H) };
  J.sh = { [LEFT]: T(d.sj, .345 * H, 0), [RIGHT]: T(-d.sj, .345 * H, 0) };
  J.neck = T(0, .356 * H, 0);
  const neckTop = T(0, .405 * H, .004 * H);
  const headPitch = mode === "guard" ? -.02 : -.02;
  J.QH = Q.clone().multiply(new THREE.Quaternion().setFromEuler(new THREE.Euler(headPitch - lean * .55, 0, 0)));
  J.head = neckTop.clone().add(V(0, .058 * H, .01 * H).applyQuaternion(J.QH));
  if (o.recoil) J.head.z -= o.recoil;

  // legs
  J.ankle = {}; J.knee = {}; J.footYaw = {};
  for (const side of [LEFT, RIGHT]) {
    const [f, fy] = feet[side];
    const ankle = V(f.x, .045 * H, f.z);
    const fdir = V(Math.sin(fy), 0, Math.cos(fy));
    const { joint, end } = ik(J.hip[side], ankle, d.thigh, d.shin, fdir.clone().add(V(side * .15, 0, 0)));
    J.knee[side] = joint; J.ankle[side] = end; J.footYaw[side] = fy;
  }

  // arms
  J.elbow = {}; J.wrist = {}; J.fdir = {};
  const chin = J.head.clone().add(V(0, -.056 * H, .03 * H));
  for (const side of [LEFT, RIGHT]) {
    const sh = J.sh[side];
    let wrist, pole;
    if (mode === "guard") {
      const wLead = clamp((1 + side * s) / 2, 0, 1);
      const leadT = chin.clone().add(V(side * .028 * H, .012 * H, .17 * H));
      const rearT = chin.clone().add(V(side * .056 * H, -.004 * H, .05 * H));
      wrist = rearT.lerp(leadT, wLead);
      if (jab > 0 && wLead > .5) {
        const aim = (o.aim || sh.clone().add(V(0, -.02 * H, 1))).clone().sub(sh).normalize();
        const full = sh.clone().addScaledVector(aim, (d.upper + d.fore) * .9995);
        wrist.lerp(full, jab * (2 * wLead - 1));
      }
      pole = V(side * .6, -1, -.25);
    } else if (mode === "stand") {
      wrist = sh.clone().add(V(side * .045 * H, -(d.upper + d.fore) * .965, .03 * H));
      pole = V(side * .25, 0, -1);
    } else {
      wrist = sh.clone().add(V(side * (d.upper + d.fore) * .9995, 0, 0));
      pole = V(0, 0, -1);
    }
    const { joint, end } = ik(sh, wrist, d.upper, d.fore, pole);
    J.elbow[side] = joint; J.wrist[side] = end;
    J.fdir[side] = end.clone().sub(joint).normalize();
  }
  return J;
}

function blendJ(A, B, k) {
  if (k >= 1) return B;
  if (k <= 0) return A;
  const out = { d: B.d, footYaw: {} };
  for (const key of ["crotch", "neck", "head"]) out[key] = A[key].clone().lerp(B[key], k);
  out.Q = A.Q.clone().slerp(B.Q, k);
  out.QH = A.QH.clone().slerp(B.QH, k);
  for (const key of ["hip", "sh", "ankle", "knee", "elbow", "wrist", "fdir"]) {
    out[key] = {};
    for (const s of [LEFT, RIGHT]) out[key][s] = A[key][s].clone().lerp(B[key][s], k);
  }
  for (const s of [LEFT, RIGHT]) out.footYaw[s] = A.footYaw[s] + (B.footYaw[s] - A.footYaw[s]) * k;
  return out;
}

class Fighter {
  constructor(corner) {
    this.corner = corner;
    this.group = new THREE.Group();
    scene.add(this.group);
    this.opacity = 1;
    const c = new THREE.Color(corner);
    this.mats = {
      skin: new THREE.MeshPhysicalMaterial({ color: COL.skin, roughness: .52, sheen: 1,
        sheenRoughness: .35, sheenColor: c, clearcoat: .2, clearcoatRoughness: .55 }),
      kit: new THREE.MeshStandardMaterial({ color: c, roughness: .6, emissive: c, emissiveIntensity: .12 }),
      dark: new THREE.MeshStandardMaterial({ color: "#1E1830", roughness: .7 }),
      gold: new THREE.MeshStandardMaterial({ color: COL.rule, roughness: .35, emissive: COL.rule,
        emissiveIntensity: .85 }),
    };
    this.meshes = [];
    const m = (geo, mat) => {
      const mesh = new THREE.Mesh(geo, mat);
      mesh.matrixAutoUpdate = false;
      mesh.castShadow = true;
      this.group.add(mesh); this.meshes.push(mesh);
      return mesh;
    };
    this.torso = m(new THREE.BufferGeometry(), this.mats.skin);
    this.shorts = m(new THREE.BufferGeometry(), this.mats.kit);
    this.neck = m(G.cyl, this.mats.skin);
    this.head = m(G.sphere, this.mats.skin);
    this.jaw = m(G.sphere, this.mats.skin);
    this.L = {};
    for (const s of [LEFT, RIGHT]) {
      this.L[s] = {
        delt: m(G.sphere, this.mats.skin), upper: m(G.upper, this.mats.skin),
        elbow: m(G.sphere, this.mats.skin), fore: m(G.fore, this.mats.skin),
        cuff: m(G.cyl, this.mats.dark), glove: m(G.sphere, this.mats.kit),
        thigh: m(G.thigh, this.mats.skin), sleeve: m(G.sleeve, this.mats.kit),
        knee: m(G.sphere, this.mats.skin), shin: m(G.shin, this.mats.skin),
        foot: m(G.sphere, this.mats.skin), band: m(G.cyl, this.mats.gold),
      };
    }
    // floor range arc (face-off)
    this.arc = new THREE.Mesh(new THREE.BufferGeometry(), new THREE.MeshBasicMaterial({
      color: corner, transparent: true, opacity: .95, depthWrite: false, side: THREE.DoubleSide }));
    this.arcFill = new THREE.Mesh(new THREE.BufferGeometry(), new THREE.MeshBasicMaterial({
      color: corner, transparent: true, opacity: .1, depthWrite: false, side: THREE.DoubleSide }));
    for (const a of [this.arc, this.arcFill]) { a.rotation.x = -Math.PI / 2; this.group.add(a); }
    this.arcR = -1; this.lastG = -1;
    this.recoil = 0;
  }
  setTarget(f) {
    this.info = f;
    this.target = params(f);
    if (!this.p) this.p = { ...this.target };
    this.hand = sideOf(f.hand);
    this.foot = sideOf(f.foot);
  }
  step(dt) {
    const k = 1 - Math.exp(-dt * 7);
    for (const key of ["H", "R", "W", "g", "lead"]) this.p[key] += (this.target[key] - this.p[key]) * k;
    if (Math.abs(this.p.g - this.lastG) > .004) {
      this.lastG = this.p.g;
      this.torso.geometry.dispose();
      this.torso.geometry = lathe(torsoProfile(this.p.g), 40, 40);
      this.shorts.geometry.dispose();
      this.shorts.geometry = lathe(shortsProfile(this.p.g), 40, 16);
    }
  }
  setOpacity(o) {
    this.opacity = o;
    for (const mat of Object.values(this.mats)) {
      mat.transparent = o < .995;
      mat.opacity = o;
      mat.depthWrite = o > .9;
    }
    for (const mesh of this.meshes) mesh.castShadow = o > .9;
  }
  setArc(show, center, r) {
    this.arc.visible = this.arcFill.visible = show;
    if (!show) return;
    if (Math.abs(r - this.arcR) > .002) {
      this.arcR = r;
      const half = .42, start = -Math.PI / 2 - half;
      this.arc.geometry.dispose();
      this.arc.geometry = new THREE.RingGeometry(r - .012, r + .006, 64, 1, start, half * 2);
      this.arcFill.geometry.dispose();
      this.arcFill.geometry = new THREE.CircleGeometry(r, 64, start, half * 2);
    }
    this.arc.position.set(center.x, .006, center.z);
    this.arcFill.position.set(center.x, .005, center.z);
  }
  place(J) {
    const d = J.d, H = d.H, g = this.p.g, gl = Math.pow(g, .6);
    const tmpQ = new THREE.Quaternion(), tmpS = V();
    const set = (mesh, pos, q, sx, sy, sz) => { mesh.matrix.compose(pos, q, tmpS.set(sx, sy, sz)); };
    const seg = (mesh, a, b, r) => {
      const dir = b.clone().sub(a); const len = dir.length();
      tmpQ.setFromUnitVectors(UP, dir.normalize());
      set(mesh, a, tmpQ, r, len, r);
    };
    set(this.torso, J.crotch, J.Q, H, H, H * .64);
    set(this.shorts, J.crotch, J.Q, H, H, H * .67);
    const headBase = J.head.clone().add(V(0, -.05 * H, -.008 * H).applyQuaternion(J.QH));
    seg(this.neck, J.neck, headBase, .03 * H * Math.sqrt(g));
    set(this.head, J.head, J.QH, d.headR * .86, d.headR, d.headR * .94);
    const jaw = J.head.clone().add(V(0, -.04 * H, .006 * H).applyQuaternion(J.QH));
    set(this.jaw, jaw, J.QH, d.headR * .6, d.headR * .5, d.headR * .66);

    for (const s of [LEFT, RIGHT]) {
      const L = this.L[s];
      const sh = J.sh[s], el = J.elbow[s], wr = J.wrist[s], fd = J.fdir[s];
      const dr = .043 * H * Math.sqrt(g);
      set(L.delt, sh, J.Q, dr * 1.05, dr, dr);
      seg(L.upper, sh, el, .033 * H * gl);
      set(L.elbow, el, J.Q, .024 * H * gl, .024 * H * gl, .024 * H * gl);
      seg(L.fore, el, wr, .028 * H * gl);
      // glove: tip lands exactly at the fingertip point (wrist + hand)
      tmpQ.setFromUnitVectors(ZAX, fd);
      const gc = wr.clone().addScaledVector(fd, d.hand - d.rg * 1.15);
      set(L.glove, gc, tmpQ, d.rg * .92, d.rg * .86, d.rg * 1.15);
      seg(L.cuff, wr.clone().addScaledVector(fd, -.022 * H), wr.clone().addScaledVector(fd, .012 * H), d.rg * .74);
      L.cuff.material = this.hand === s ? this.mats.gold : this.mats.dark;
      // legs
      const hp = J.hip[s], kn = J.knee[s], an = J.ankle[s];
      seg(L.thigh, hp, kn, .06 * H * gl);
      const sl = hp.clone().lerp(kn, .4);
      seg(L.sleeve, hp.clone().add(V(0, .015 * H, 0)), sl, .066 * H * gl);
      set(L.knee, kn, J.Q, .038 * H * gl, .038 * H * gl, .038 * H * gl);
      seg(L.shin, kn, an, .042 * H * gl);
      const fy = J.footYaw[s];
      tmpQ.setFromEuler(new THREE.Euler(0, fy, 0));
      const fpos = V(an.x + Math.sin(fy) * .036 * H, .019 * H, an.z + Math.cos(fy) * .036 * H);
      set(L.foot, fpos, tmpQ, .029 * H, .02 * H, .07 * H);
      L.band.visible = this.foot === s;
      seg(L.band, V(an.x, .04 * H, an.z), V(an.x, .072 * H, an.z), .031 * H * gl);
    }
  }
  dispose() {
    scene.remove(this.group);
  }
}

// ------------------------------------------------------------------ annotation helpers
const labelsEl = document.getElementById("labels");
const labels = {};
function label(id, cls) {
  if (!labels[id]) {
    const el = document.createElement("div");
    el.className = "lab " + cls;
    labelsEl.appendChild(el);
    labels[id] = { el, html: null, seen: false };
  }
  return labels[id];
}
const proj = V();
function putLabel(id, cls, world, html, { color = COL.ink, ax = -.5, ay = -1, dx = 0, dy = 0, op = 1 } = {}) {
  const L = label(id, cls);
  L.seen = true;
  if (L.html !== html) { L.el.innerHTML = html; L.html = html; }
  proj.copy(world).project(camera);
  const w = wrap.clientWidth, h = wrap.clientHeight;
  const x = (proj.x * .5 + .5) * w + dx, y = (-proj.y * .5 + .5) * h + dy;
  L.el.style.color = color;
  L.el.style.opacity = proj.z < 1 ? op : 0;
  L.el.style.transform = `translate(${x}px, ${y}px) translate(${ax * 100}%, ${ay * 100}%)`;
}
function endLabels() {
  for (const L of Object.values(labels)) {
    if (!L.seen) L.el.style.opacity = 0;
    L.seen = false;
  }
}

class Seg {

    this.dashed = dashed;
    const geo = new THREE.BufferGeometry().setFromPoints([V(), V(0, 1, 0)]);
    const mat = dashed
      ? new THREE.LineDashedMaterial({ color, dashSize: .035, gapSize: .025, transparent: true, opacity })
      : new THREE.LineBasicMaterial({ color, transparent: true, opacity });
    this.line = new THREE.Line(geo, mat);
    this.line.frustumCulled = false;
    scene.add(this.line);
  }
  set(a, b) {
    const pos = this.line.geometry.attributes.position;
    pos.setXYZ(0, a.x, a.y, a.z); pos.setXYZ(1, b.x, b.y, b.z);
    pos.needsUpdate = true;
    if (this.dashed) this.line.computeLineDistances();

  }
  hide() { this.line.visible = false; }
}
const segs = {};
const seg = (id, color, dashed, op) => (segs[id] ||= new Seg(color, dashed, op));
let usedSegs = new Set();
function line(id, a, b, color, dashed = false, op = 1) { seg(id, color, dashed, op).set(a, b); usedSegs.add(id); }
function endSegs() { for (const [id, s] of Object.entries(segs)) if (!usedSegs.has(id)) s.hide(); usedSegs = new Set(); }

// ------------------------------------------------------------------ state
const MODES = { face: "guard", tape: "stand", reach: "tpose" };
let mode = "face", prevMode = "face", modeT = 1;
let fighters = [];               // Fighter instances
let figs = [];                   // incoming dicts
let firstRender = true;
let camTween = null;
const head = document.getElementById("head");
let headHTML = "";

function cornerOf(i, f) { return f.corner || (i === 0 ? COL.a : COL.b); }

function syncFighters() {
  const list = figs.slice(0, 2);
  while (fighters.length > list.length) fighters.pop().dispose();
  list.forEach((f, i) => {
    const corner = cornerOf(i, f);
    if (!fighters[i] || fighters[i].corner !== corner) {
      if (fighters[i]) fighters[i].dispose();
      fighters[i] = new Fighter(corner);
    }
    fighters[i].setTarget(f);
  });
}

// Face-off geometry: distance at which the longer jab just touches the other's face.
function faceoff(t) {
  const [A, B] = fighters;
  const JA = solve(A.p, "guard", { jab: 1 }), JB = B ? solve(B.p, "guard", { jab: 1 }) : null;
  const leadSh = (F, J) => J.sh[F.p.lead > 0 ? LEFT : RIGHT];
  const reachTo = (F, J, Jo) => {
    const sh = leadSh(F, J), arm = J.d.arm;
    const tgt = Jo ? V(-Jo.head.x, Jo.head.y - .01 * Jo.d.H, 0) : V(sh.x, J.head.y - .05 * J.d.H, 0);
    const dx = tgt.x - sh.x, dy = tgt.y - sh.y;
    const dz = Math.sqrt(Math.max(arm * arm - dx * dx - dy * dy, .01));
    return { sh, dz, tgtY: tgt.y, tgtX: tgt.x, face: Jo ? Jo.head.z + Jo.d.headR * .92 : 0 };
  };
  if (!B) {
    const r = reachTo(A, JA, null);
    return { single: true, ra: r };
  }
  const ra = reachTo(A, JA, JB), rb = reachTo(B, JB, JA);
  const dA = ra.sh.z + ra.dz + ra.face, dB = rb.sh.z + rb.dz + rb.face;
  const d = Math.max(dA, dB, .75);
  return { d, ra, rb, shortA: d - dA, shortB: d - dB };
}

function jabEnv(tt) {
  if (tt < 0) return 0;
  if (tt < .17) return easeOut(tt / .17);
  if (tt < .45) return 1;
  if (tt < .78) return 1 - ease((tt - .45) / .33);
  return 0;
}

// ------------------------------------------------------------------ camera framing
function frameFor(m) {
  const n = fighters.length;
  if (!n) return null;
  const maxH = Math.max(...fighters.map(f => f.target.H));
  const maxR = Math.max(...fighters.map(f => f.target.R));
  const aspect = camera.aspect || 1.4;
  const tanH = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
  let W, y0, y1, az, el;
  if (m === "face") {
    W = n > 1 ? 1.1 + .75 * maxH : .5 * maxH + 1.1; y0 = 0; y1 = maxH + .28;
    az = n > 1 ? .34 : 1.05; el = .14;
  } else if (m === "tape") {
    W = n > 1 ? .7 * maxH + 1.2 : .7 * maxH; y0 = -.24; y1 = maxH + .06; az = .16; el = .1;
  } else {
    W = maxR + .3; y0 = 0; y1 = maxH + .5; az = .08; el = .08;
  }
  const Hh = (y1 - y0) / .76;
  const ty = (y0 + y1) / 2 + .045 * Hh;
  const dist = Math.max((Hh / 2) / tanH, (W / 2) / (tanH * aspect)) * 1.04;
  const base = m === "face" && n > 1 ? V(Math.cos(az), 0, Math.sin(az)) : V(Math.sin(az), 0, Math.cos(az));
  const pos = base.multiplyScalar(Math.cos(el) * dist).add(V(0, ty + Math.sin(el) * dist, 0));
  return { pos, target: V(0, ty, 0) };
}
function flyTo(m, instant = false) {
  const f = frameFor(m);
  if (!f) return;
  if (instant) {
    camera.position.copy(f.pos); controls.target.copy(f.target); controls.update(); camTween = null;
    return;
  }
  camTween = { t: 0, p0: camera.position.clone(), t0: controls.target.clone(), p1: f.pos, t1: f.target };
}

// ------------------------------------------------------------------ main loop
const clock = new THREE.Clock();
let time = 0;
function frame() {
  const dt = Math.min(clock.getDelta(), .1);
  time += dt;
  modeT = Math.min(modeT + dt / .7, 1);
  const k = ease(modeT);
  const n = fighters.length;
  fighters.forEach(F => F.step(dt));

  // placement per mode
  const fo = n ? faceoff(time) : null;
  const maxH = n ? Math.max(...fighters.map(f => f.p.H)) : 1.8;
  const spacing = .34 * maxH + .12;
  const place = (m, i) => {
    if (m === "face") {
      if (n < 2) return { x: 0, z: 0, yaw: 0 };
      return i === 0 ? { x: 0, z: -fo.d / 2, yaw: 0 } : { x: 0, z: fo.d / 2, yaw: Math.PI };
    }
    if (m === "tape") return n < 2 ? { x: 0, z: 0, yaw: 0 } : { x: i === 0 ? -spacing : spacing, z: 0, yaw: 0 };
    return { x: 0, z: 0, yaw: 0 };
  };

  // jab timing (face-off only)
  const P = n > 1 ? 4.6 : 3.2;
  const ph = time % P;
  const env = [jabEnv(ph - .6), n > 1 ? jabEnv(ph - 2.9) : 0];
  const faceW = (prevMode === "face" ? 1 - k : 0) + (mode === "face" ? k : 0);

  fighters.forEach((F, i) => {
    const o = n > 1 ? (i === 0 ? fo.rb : fo.ra) : null;
    let aim = null;
    if (n > 1) {
      const me = i === 0 ? fo.ra : fo.rb;
      aim = V(me.tgtX, me.tgtY, fo.d - me.face);
    }
    // recoil when the opponent's jab lands
    const other = 1 - i;
    const landed = n > 1 && (other === 0 ? fo.shortA : fo.shortB) < .015 && env[other] > .92;
    F.recoil += ((landed ? .02 * F.p.H : 0) - F.recoil) * Math.min(dt * 18, 1);
    const opts = { t: time + i * .37, jab: env[i] * faceW, aim, recoil: F.recoil };
    const Jp = solve(F.p, MODES[prevMode], opts), Jc = solve(F.p, MODES[mode], opts);
    F.place(blendJ(Jp, Jc, k));
    const a = place(prevMode, i), b = place(mode, i);
    F.group.position.set(a.x + (b.x - a.x) * k, 0, a.z + (b.z - a.z) * k);
    F.group.rotation.y = a.yaw + (b.yaw - a.yaw) * k;
    // overlay mode: corner B becomes a translucent ghost so both silhouettes read
    const op = (prevMode === "reach" && i === 1 ? 1 - k : 0) + (mode === "reach" && i === 1 ? k : 0);
    const target = 1 - .62 * op;
    if (Math.abs(target - F.opacity) > .004) F.setOpacity(target);
    // range arcs
    const r = n > 1 ? (i === 0 ? fo.ra : fo.rb) : fo.ra;
    F.setArc(mode === "face" && k > .6, r.sh, r.dz);
  });

  if (camTween) {
    camTween.t = Math.min(camTween.t + dt / .9, 1);
    const e = ease(camTween.t);
    camera.position.lerpVectors(camTween.p0, camTween.p1, e);
    controls.target.lerpVectors(camTween.t0, camTween.t1, e);
    if (camTween.t >= 1) camTween = null;
  }

  renderer.render(scene, camera);

}
renderer.setAnimationLoop(frame);

function annotate(fo, env, k) {
  const n = fighters.length;
  if (!n) { endLabels(); endSegs(); return; }
  const ready = k > .85;
  const name = F => esc(F.info.label || "Fighter");
  const H = F => F.p.H;
  let html = "";

  if (mode === "face") {
    if (n > 1) {
      const [A, B] = fighters;
      const longA = fo.shortB >= fo.shortA;
      const L = longA ? A : B, S = longA ? B : A;
      const gap = cm(Math.max(fo.shortA, fo.shortB));
      html = gap < 2
        ? `Even range<span>From jabbing distance both lead hands reach the other's face.</span>`
        : `${who(L)} ${vb(L, "owns", "own")} the range<span>At the distance where ${poss(L)} jab just lands, ${isYou(S) ? "yours" : poss(S)} falls ${gap} cm short.</span>`;
      const tops = fighters.map(F => solve(F.p, "guard", {}).head.clone()
        .applyMatrix4(F.group.matrixWorld).add(V(0, .16, 0)));
      const sx = tops.map(t => t.clone().project(camera).x);
      fighters.forEach((F, i) => {
        const leftSide = sx[i] < sx[1 - i];
        putLabel("tag" + i, "tag", tops[i], `${name(F)}<small>${esc(F.info.stance || "")}, ${esc((F.info.hand || "").toLowerCase())}-handed</small>`,
          { color: F.corner, ax: leftSide ? -1 : 0, dx: leftSide ? 18 : -18, op: ready ? 1 : 0 });
        const e = env[i];
        if (e > .5) {
          const short = i === 0 ? fo.shortA : fo.shortB;
          const lead = F.p.lead > 0 ? LEFT : RIGHT;
          const Jj = solve(F.p, "guard", { jab: 1, aim: V((i === 0 ? fo.ra : fo.rb).tgtX, (i === 0 ? fo.ra : fo.rb).tgtY, fo.d - (i === 0 ? fo.ra : fo.rb).face) });
          const tip = Jj.wrist[lead].clone().addScaledVector(Jj.fdir[lead], Jj.d.hand).applyMatrix4(F.group.matrixWorld);
          const txt = short < .015 ? "Lands" : `${cm(short)} cm short`;
          putLabel("jab" + i, "chip", tip.add(V(0, .1, 0)), txt,
            { color: short < .015 ? COL.rule : F.corner, op: clamp((e - .5) * 2.5, 0, 1) });
        }
      });
    } else {
      const F = fighters[0];
      const leadSide = F.p.lead > 0 ? LEFT : RIGHT;
      const power = F.hand === leadSide ? "Power hand leads, so the jab is the best weapon."
                                         : "Power hand sits at the back for the straight and the hook.";
      html = `${isYou(F) ? "Your" : possFull(F)} ${esc((F.info.stance || "orthodox").toLowerCase())} stance<span>${power} The arc on the mat is jab range: ${cm(fo.ra.dz)} cm from the lead shoulder.</span>`;
      const J = solve(F.p, "guard", {});
      putLabel("tag0", "tag", J.head.clone().applyMatrix4(F.group.matrixWorld).add(V(0, .16, 0)),
        `${name(F)}`, { color: F.corner, op: ready ? 1 : 0 });
    }
  }

  if (mode === "tape") {
    const xs = fighters.map(F => F.group.position.x);
    const x0 = Math.min(...xs) - .42, x1 = Math.max(...xs) + .42;
    fighters.forEach((F, i) => {
      const y = H(F);
      line("h" + i, V(x0, y, -.12), V(x1, y, -.12), F.corner, true, .9);
      const below = n > 1 && i === (H(fighters[0]) >= H(fighters[1]) ? 1 : 0);
      putLabel("hv" + i, "val", V(x1 + .03, y, -.12), `${cm(y)} cm`,
        { color: F.corner, ax: 0, ay: -.5, dy: below ? 9 : -9, op: ready ? 1 : 0 });
      putLabel("tag" + i, "tag", V(F.group.position.x, -.02, .1), `${name(F)}<small>${Math.round(F.target.W)} kg, ape index ${fmtSigned(cm(F.p.R - F.p.H))} cm</small>`,
        { color: F.corner, ay: 0, op: ready ? 1 : 0 });
    });
    if (n > 1) {
      const [A, B] = fighters;
      const dh = cm(A.p.H - B.p.H), dw = Math.round(A.target.W - B.target.W);
      const T = dh >= 0 ? A : B, S = dh >= 0 ? B : A;
      html = Math.abs(dh) < 1
        ? `Same height<span>${weightLine(A, B, dw)}</span>`
        : `${who(T)} ${vb(T, "stands", "stand")} ${Math.abs(dh)} cm taller<span>${weightLine(A, B, dw)}</span>`;
      line("dh", V(x1 - .05, A.p.H, -.12), V(x1 - .05, B.p.H, -.12), COL.rule);
    } else {
      const F = fighters[0];
      html = `${cm(F.p.H)} cm, ${Math.round(F.target.W)} kg<span>BMI ${(F.target.W / (F.p.H * F.p.H)).toFixed(1)}. The body model widens with weight relative to height.</span>`;
    }
  }

  if (mode === "reach") {
    const top = Math.max(...fighters.map(H));
    fighters.forEach((F, i) => {
      const y = top + .1 + .17 * i, half = F.p.R / 2;
      const shY = .815 * F.p.H - .004 * F.p.H;
      line("r" + i, V(-half, y, 0), V(half, y, 0), F.corner);
      line("rl" + i, V(-half, y + .025, 0), V(-half, y - .025, 0), F.corner);
      line("rr" + i, V(half, y + .025, 0), V(half, y - .025, 0), F.corner);
      line("dl" + i, V(-half, y, 0), V(-half, shY, 0), F.corner, true, .7);
      line("dr" + i, V(half, y, 0), V(half, shY, 0), F.corner, true, .7);
      putLabel("rv" + i, "val", V(0, y, 0), `${n > 1 ? name(F) + " " : "Reach "}${cm(F.p.R)} cm`,
        { color: F.corner, ay: -1, dy: -4, op: ready ? 1 : 0 });
    });
    if (n > 1) {
      const [A, B] = fighters;
      const dr = cm(A.p.R - B.p.R);
      const Lf = dr >= 0 ? A : B;
      html = Math.abs(dr) < 1
        ? `Matching arm span<span>Ape index (reach minus height): ${apeLine(A)}, ${apeLine(B)}.</span>`
        : `${possFull(Lf)} arms span ${Math.abs(dr)} cm wider<span>Ape index (reach minus height): ${apeLine(A)}, ${apeLine(B)}. The translucent figure is ${isYou(B) ? "you" : esc(B.info.label || "corner B")}.</span>`;
    } else {
      const F = fighters[0];
      const ape = cm(F.p.R - F.p.H);
      const x = F.p.R / 2 + .14;
      line("hgt", V(x, 0, 0), V(x, F.p.H, 0), COL.rule);
      line("hgt2", V(x - .025, F.p.H, 0), V(x + .025, F.p.H, 0), COL.rule);
      putLabel("hgtv", "val", V(x + .03, F.p.H * .5, 0), `Height ${cm(F.p.H)} cm`,
        { color: COL.rule, ax: 0, ay: -.5, op: ready ? 1 : 0 });
      html = `Reach ${cm(F.p.R)} cm<span>Ape index ${fmtSigned(ape)} cm: arms ${ape >= 4 ? "longer than" : ape <= -4 ? "shorter than" : "about the same as"} height${ape >= 4 ? ", an edge at range" : ""}.</span>`;
    }
  }
  if (html !== headHTML) { head.innerHTML = html; headHTML = html; }
  endLabels(); endSegs();
}
const fmtSigned = v => (v > 0 ? "+" : v < 0 ? "−" : "") + Math.abs(v);
const apeLine = F => `${short_(F)} ${fmtSigned(cm(F.p.R - F.p.H))} cm`;
const weightLine = (A, B, dw) => Math.abs(dw) < 1
  ? "Same weight on the scale."
  : (F => `${isYou(F) ? "You carry" : short_(F) + " carries"} ${Math.abs(dw)} kg more.`)(dw > 0 ? A : B);

// ------------------------------------------------------------------ UI
const btn = { face: document.getElementById("mFace"), tape: document.getElementById("mTape"),
              reach: document.getElementById("mReach") };
function setMode(m) {
  if (m === mode) return;
  prevMode = mode; mode = m; modeT = 0;
  for (const [key, b] of Object.entries(btn)) b.classList.toggle("on", key === m);
  flyTo(m);
}
btn.face.onclick = () => setMode("face");
btn.tape.onclick = () => setMode("tape");
btn.reach.onclick = () => setMode("reach");
const bSpin = document.getElementById("bSpin");
const syncSpin = () => bSpin.classList.toggle("on", controls.autoRotate);
bSpin.onclick = () => { controls.autoRotate = !controls.autoRotate; syncSpin(); };
document.getElementById("bReset").onclick = () => flyTo(mode);
controls.addEventListener("start", () => { camTween = null; });

function resize() {
  const w = wrap.clientWidth, h = wrap.clientHeight;
  if (!w || !h) return;
  renderer.setSize(w, h, false);
  renderer.domElement.style.width = w + "px";
  renderer.domElement.style.height = h + "px";
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
new ResizeObserver(() => { resize(); }).observe(wrap);

// ------------------------------------------------------------------ inputs
window.addEventListener("message", (e) => {
  const d = e.data;
  if (!d || d.type !== "streamlit:render") return;
  const args = d.args || {};
  frameHeight = args.height || 520;
  wrap.style.height = frameHeight + "px";
  send("streamlit:setFrameHeight", { height: frameHeight });
  figs = args.figures || [];
  const countChanged = figs.length !== fighters.length;
  syncFighters();
  resize();
  if (firstRender) {
    const p = args.pose;
    const m = p === "tpose" || p === "reach" ? "reach" : p === "stand" || p === "tape" ? "tape" : "face";
    mode = prevMode = m;
    for (const [key, b] of Object.entries(btn)) b.classList.toggle("on", key === m);
    if (args.autorotate === false || REDUCE) controls.autoRotate = false;
    syncSpin();
    flyTo(mode, true);
    firstRender = false;
  } else if (countChanged) {
    flyTo(mode);
  }
