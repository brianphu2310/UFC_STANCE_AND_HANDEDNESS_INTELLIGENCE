<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Body 3D</title>
<style>
  @font-face { font-family: "Instrument Sans"; src: url("/app/static/fonts/instrument-sans-latin-400-normal.woff2") format("woff2"); font-weight: 400; }
  @font-face { font-family: "Instrument Sans"; src: url("/app/static/fonts/instrument-sans-latin-600-normal.woff2") format("woff2"); font-weight: 600; }
  @font-face { font-family: "Big Shoulders Display"; src: url("/app/static/fonts/big-shoulders-display-latin-700-normal.woff2") format("woff2"); font-weight: 700; }
  @font-face { font-family: "Big Shoulders Display"; src: url("/app/static/fonts/big-shoulders-display-latin-800-normal.woff2") format("woff2"); font-weight: 800; }
  :root { --bg:#0E0A17; --ink:#EFEAF6; --ink2:#BDB4D2; --mute:#8A81A3; --line:#2B2242;
          --a:#C862CE; --b:#5A54D8; --rule:#E4C49B; }
  html, body { margin:0; height:100%; background:var(--bg); overflow:hidden; color:var(--ink);
               font-family:"Instrument Sans", "Segoe UI", system-ui, sans-serif; }
  #wrap { position:relative; width:100%; height:100%; overflow:hidden; box-sizing:border-box;
          border:1px solid var(--line); border-radius:6px;
          background: radial-gradient(110% 75% at 50% 100%, #2A1D45 0%, #160F27 48%, #0E0A17 80%); }
  canvas { display:block; position:absolute; inset:0; }
  #labels { position:absolute; inset:0; pointer-events:none; overflow:hidden; }
  .lab { position:absolute; left:0; top:0; white-space:nowrap; will-change:transform; transition:opacity .2s; }
  .tag.l { text-align:right; }
  .tag { font-family:"Big Shoulders Display", sans-serif; font-weight:700; font-size:17px; line-height:1;
         text-align:center; text-shadow:0 1px 10px rgba(0,0,0,.8); }
  .tag small { display:block; font-family:"Instrument Sans", sans-serif; font-weight:400; font-size:11.5px;
               color:var(--ink2); margin-top:3px; }
  .chip { font-size:12px; font-weight:600; padding:3px 8px; border-radius:3px; line-height:1.2;
          background:rgba(14,10,23,.88); border:1px solid currentColor; }
  .val { font-family:"Big Shoulders Display", sans-serif; font-weight:700; font-size:15px;
         text-shadow:0 1px 8px rgba(0,0,0,.8); }
  .hud { position:absolute; top:12px; left:14px; right:14px; pointer-events:none; display:flex;
         justify-content:space-between; align-items:flex-start; gap:14px; }
  .head { flex:1 1 auto; min-width:0; }
  .rt { border-collapse:collapse; font-size:12px; background:rgba(14,10,23,.78); border:1px solid var(--line);
        border-radius:4px; }
  .rt th, .rt td { padding:4px 9px; text-align:left; white-space:nowrap; }
  .rt th { font-family:"Big Shoulders Display", sans-serif; font-weight:700; font-size:14px; padding-top:6px; }
  .rt td:first-child { color:var(--ink2); }
  .rt tr.on td { background:rgba(228,196,155,.13); }
  .rt td.ok { color:var(--rule); font-weight:600; }
  .rt td.no { color:var(--mute); }
  .head { font-family:"Big Shoulders Display", sans-serif; font-weight:800; font-size:23px; line-height:1.05;
          max-width:560px; text-wrap:balance; }
  .head span { display:block; font-family:"Instrument Sans", sans-serif; font-weight:400; font-size:12.5px;
               line-height:1.4; color:var(--ink2); margin-top:5px; max-width:460px; }
  .bar { position:absolute; left:12px; right:12px; bottom:12px; display:flex; align-items:center;
         gap:10px; flex-wrap:wrap; }
  .seg { display:inline-flex; border:1px solid var(--line); border-radius:4px; overflow:hidden;
         background:rgba(21,16,36,.9); }
  .seg button, .tool { all:unset; cursor:pointer; font-size:12.5px; padding:6px 12px; color:var(--ink2); }
  .seg button + button { border-left:1px solid var(--line); }
  .seg button.on { background:var(--a); color:#fff; }
  .tool { padding:6px 10px; color:var(--ink2); background:rgba(21,16,36,.9); border:1px solid var(--line); border-radius:4px; }
  .tool.on { color:var(--ink); border-color:#4A3B70; }
  .seg button:focus-visible, .tool:focus-visible { outline:2px solid var(--rule); outline-offset:-2px; }
  .spacer { flex:1; }
  .key { font-size:11.5px; color:var(--ink2); }
  .key i { display:inline-block; width:14px; height:4px; border-radius:2px; margin-right:6px;
           vertical-align:middle; background:var(--rule); box-shadow:0 0 6px var(--rule); }
  @media (max-width: 900px) { .key { display:none; } }
  @media (max-width: 600px) { .head { font-size:19px; } .head span { display:none; } .rt { font-size:11px; }
                              .seg button, .tool { padding:5px 8px; font-size:12px; } }
</style>
<script type="importmap">
  { "imports": { "three": "./three.module.min.js" } }
</script>
</head>
<body>
<div id="wrap">
  <div id="labels"></div>
  <div class="hud"><div class="head" id="head"></div><div id="range"></div></div>
  <div class="bar">
    <div class="seg" role="group" aria-label="View">
      <button id="mFace" class="on">Face-off</button>
      <button id="mTape">Height</button>
      <button id="mReach">Reach</button>
    </div>
    <div class="seg" role="group" aria-label="Strike" id="strikes">
      <button data-k="combo" class="on">Combo</button>
      <button data-k="jab">Jab</button>
      <button data-k="cross">Cross</button>
      <button data-k="kick">Kick</button>
    </div>
    <button class="tool on" id="bSpin">Rotate</button>
    <button class="tool" id="bReset">Reset</button>
    <span class="spacer"></span>
    <span class="key"><i></i>Gold band marks the dominant hand and foot</span>
  </div>
</div>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "./OrbitControls.js";

// ------------------------------------------------------------------ bridge
const send = (type, data = {}) =>
  window.parent.postMessage({ isStreamlitMessage: true, type, ...data }, "*");
let frameHeight = 520;

const COL = { a: "#C862CE", b: "#5A54D8", rule: "#E4C49B", skin: "#CDC4DC", ink: "#EFEAF6" };
const REDUCE = matchMedia("(prefers-reduced-motion: reduce)").matches;
const V = (x = 0, y = 0, z = 0) => new THREE.Vector3(x, y, z);
const UP = V(0, 1, 0), ZAX = V(0, 0, 1);
const clamp = (x, a, b) => Math.min(Math.max(x, a), b);
const ease = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const easeOut = t => 1 - Math.pow(1 - t, 3);
const cm = m => Math.round(m * 100);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const first = s => String(s).split(" ").slice(-1)[0];
const isYou = F => String(F.info.label || "").trim().toLowerCase() === "you";
const who = F => isYou(F) ? "You" : esc(F.info.label || "Fighter");            // sentence subject
const short_ = F => isYou(F) ? "you" : esc(first(F.info.label || "Fighter"));
const poss = (F, cap = false) => isYou(F) ? (cap ? "Your" : "your") : esc(first(F.info.label || "Fighter")) + "'s";
const possFull = F => isYou(F) ? "Your" : esc(F.info.label || "Fighter") + "'s";
const vb = (F, s3, base) => isYou(F) ? base : s3;

// ------------------------------------------------------------------ renderer / scene
const wrap = document.getElementById("wrap");
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setClearColor(0x000000, 0);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
wrap.prepend(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(30, 1, 0.05, 60);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.autoRotateSpeed = 0.7;
controls.minDistance = 1.4;
controls.maxDistance = 14;
controls.maxPolarAngle = Math.PI * 0.52;
controls.autoRotate = !REDUCE;

scene.add(new THREE.HemisphereLight("#d8ccff", "#120c20", 0.7));
const spot = new THREE.SpotLight("#fff3e6", 5.5, 0, 0.55, 0.85, 0);
spot.position.set(0.8, 7, 1.4);
spot.target.position.set(0, 0.9, 0);
spot.castShadow = true;
spot.shadow.mapSize.set(2048, 2048);
spot.shadow.bias = -0.0004;
spot.shadow.camera.near = 2; spot.shadow.camera.far = 14;
scene.add(spot, spot.target);
const rimA = new THREE.DirectionalLight(COL.a, 2.4); rimA.position.set(-3, 2.6, -4.5); scene.add(rimA);
const rimB = new THREE.DirectionalLight(COL.b, 3.0); rimB.position.set(-3, 2.6, 4.5); scene.add(rimB);
const fill = new THREE.DirectionalLight("#c8bcff", 0.45); fill.position.set(5, 2, 1); scene.add(fill);

// ---- octagon mat
const MAT_R = 3.0;
const floor = new THREE.Mesh(new THREE.CircleGeometry(MAT_R, 8),
  new THREE.MeshStandardMaterial({ color: "#1B1430", roughness: 0.95 }));
floor.rotation.x = -Math.PI / 2;
floor.rotation.z = Math.PI / 8;
floor.receiveShadow = true;
scene.add(floor);
function octLoop(r, color, opacity = 1) {
  const pts = [];
  for (let k = 0; k <= 8; k++) {
    const a = Math.PI / 8 + k * Math.PI / 4;
    pts.push(V(r * Math.cos(a), 0.003, r * Math.sin(a)));
  }
  return new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),
    new THREE.LineBasicMaterial({ color, transparent: true, opacity }));
}
scene.add(octLoop(MAT_R, "#4A3B70"), octLoop(MAT_R - 0.06, "#2B2242"), octLoop(1.25, "#2B2242", 0.7));
const postGeo = new THREE.CylinderGeometry(0.06, 0.06, 0.26, 16);
for (let k = 0; k < 8; k++) {
  const a = Math.PI / 8 + k * Math.PI / 4;
  const isA = k === 5, isB = k === 1;
  const c = isA ? COL.a : isB ? COL.b : "#2B2242";
  const post = new THREE.Mesh(postGeo, new THREE.MeshStandardMaterial({
    color: c, roughness: 0.5, emissive: c, emissiveIntensity: isA || isB ? 0.9 : 0.05 }));
  post.position.set(MAT_R * Math.cos(a), 0.13, MAT_R * Math.sin(a));
  scene.add(post);
}

// ------------------------------------------------------------------ geometry library
function lathe(profile, seg = 32, n = 28) {
  const curve = new THREE.SplineCurve(profile.map(([r, y]) => new THREE.Vector2(r, y)));
  const pts = curve.getPoints(n).map(v => new THREE.Vector2(Math.max(v.x, 1e-3), v.y));
  return new THREE.LatheGeometry(pts, seg);
}
const G = {
  upper: lathe([[.82, 0], [.93, .12], [1, .38], [.95, .6], [.8, .84], [.7, 1]]),
  fore:  lathe([[.76, 0], [.95, .14], [1, .3], [.84, .6], [.66, .88], [.6, 1]]),
  thigh: lathe([[1, 0], [1, .16], [.96, .42], [.85, .7], [.7, .92], [.64, 1]]),
  shin:  lathe([[.7, 0], [.9, .12], [1, .27], [.85, .52], [.6, .8], [.5, 1]]),
  sleeve: lathe([[1.0, 0], [1.02, .5], [.98, 1]], 32, 8),
  sphere: new THREE.SphereGeometry(1, 40, 28),
  cyl: new THREE.CylinderGeometry(1, 1, 1, 28, 1).translate(0, 0.5, 0),
};
function torsoProfile(g) {
  const s = Math.sqrt(g), w = Math.pow(g, 1.3), c = .86 + .14 * g;
  return [[.02, 0], [.064 * s, .012], [.082 * s, .035], [.085 * s, .066], [.081 * w, .1],
          [.079 * w, .14], [.081 * w, .17], [.093 * c, .21], [.11 * c, .25], [.118 * c, .285],
          [.116 * c, .315], [.098 * c, .337], [.06, .356], [.034, .372]];
}
function shortsProfile(g) {
  const s = Math.sqrt(g), w = Math.pow(g, 1.3), k = 1.07;
  return [[.05 * s * k, -.004], [.072 * s * k, .012], [.087 * s * k, .035], [.09 * s * k, .066],
          [.086 * w * k, .1], [.084 * w * k, .135]];
}

// ------------------------------------------------------------------ fighter
const LEFT = 1, RIGHT = -1;          // +x is the fighter's own left side
const sideOf = s => (s === "Left" ? LEFT : RIGHT);

function params(f) {
  const H = clamp((f.height_cm || 175) / 100, 1.4, 2.2);
  const R = clamp((f.reach_cm || f.height_cm || 175) / 100, 1.3, 2.4);
  const W = clamp(f.weight_kg || 70, 40, 150);
  return { H, R, W, g: clamp(Math.sqrt(W / (H * H) / 23), 0.82, 1.42),
           lead: f.stance === "Southpaw" ? RIGHT : LEFT };
}

function dims(p) {
  const H = p.H;
  const sj = .1 * H * (.93 + .07 * p.g);
  const arm = Math.max(p.R / 2 - sj, .3 * H);
  return { H, sj, arm, upper: .44 * arm, fore: .36 * arm, hand: .2 * arm,
           thigh: .225 * H, shin: .235 * H, foot: .05 * H, headR: .062 * H, rg: .04 * H * (.95 + .05 * p.g) };
}

function ik(a, target, l1, l2, pole) {
  const d = target.clone().sub(a);
  const dist = clamp(d.length(), 1e-4, (l1 + l2) * 0.9995);
  const dir = d.normalize();
  const end = a.clone().addScaledVector(dir, dist);
  const x = (l1 * l1 - l2 * l2 + dist * dist) / (2 * dist);
  const h = Math.sqrt(Math.max(l1 * l1 - x * x, 0));
  const perp = pole.clone().addScaledVector(dir, -pole.dot(dir));
  if (perp.lengthSq() < 1e-8) perp.set(0, 0, -1);
  perp.normalize();
  return { joint: a.clone().addScaledVector(dir, x).addScaledVector(perp, h), end };
}

// Pose solver: returns joint positions in the fighter's local frame (faces +z).
// o.ej / o.ec / o.ek: jab, cross and rear-kick amounts (0..1). o.face / o.ribs: targets (local).
function solve(p, mode, o = {}) {
  const d = dims(p), H = d.H, s = p.lead;
  const t = o.t || 0;
  const guard = mode === "guard";
  const ej = guard ? (o.ej || 0) : 0, ec = guard ? (o.ec || 0) : 0, ek = guard ? (o.ek || 0) : 0;
  const J = { d, footQ: {} };
  const wl = (1 + s) / 2, S = 2 * wl - 1;            // +1 orthodox, -1 southpaw (continuous)
  const rearX = -S;                                    // x sign of the rear side
  const leadSide = S >= 0 ? LEFT : RIGHT, rearSide = -leadSide;
  let drop, yaw, lean, roll = 0;
  const shift = V();
  const feet = {};
  if (guard) {
    const bounce = REDUCE ? 0 : Math.sin(t * Math.PI * 2 * 1.5) * .007 * H * (1 - ek);
    drop = .055 * H + bounce + .012 * H * ej + .022 * H * ec - .03 * H * ek;
    yaw = -S * (.52 + .2 * ej) + S * .9 * ec + S * 1.3 * ek;
    lean = .11 + .06 * ej + .1 * ec - .34 * ek;
    roll = -S * .28 * ek;
    shift.set(S * .02 * H * ek, 0, .035 * H * ec + .1 * H * ek);
    feet[LEFT] = [V(.062 * H, 0, .17 * H).lerp(V(.088 * H, 0, -.15 * H), 1 - wl), -.2 * wl + .8 * (1 - wl)];
    feet[RIGHT] = [V(-.088 * H, 0, -.15 * H).lerp(V(-.062 * H, 0, .17 * H), 1 - wl), -.8 * wl + .2 * (1 - wl)];
    feet[rearSide][1] += S * .6 * ec;                 // rear heel turns out on the cross
    feet[leadSide][1] += S * 1.35 * ek;               // support foot turns out to plant the kick
  } else {
    const breathe = REDUCE ? 0 : Math.sin(t * Math.PI * 2 * .25) * .002 * H;
    drop = .004 * H + breathe; yaw = 0; lean = .02;
    feet[LEFT] = [V(.07 * H, 0, .01 * H), .14]; feet[RIGHT] = [V(-.07 * H, 0, .01 * H), -.14];
  }
  if (o.flinch) shift.x += o.flinch;
  const Q = new THREE.Quaternion().setFromEuler(new THREE.Euler(lean, yaw, roll, "YXZ"));
  const crotch = V(0, .47 * H - drop, .005 * H).add(shift);
  const T = (x, y, z) => V(x, y, z).applyQuaternion(Q).add(crotch);
  J.Q = Q; J.crotch = crotch;
  J.hip = { [LEFT]: T(.052 * Math.sqrt(p.g) * H, .035 * H, .005 * H),
            [RIGHT]: T(-.052 * Math.sqrt(p.g) * H, .035 * H, .005 * H) };
  J.sh = { [LEFT]: T(d.sj, .345 * H, 0), [RIGHT]: T(-d.sj, .345 * H, 0) };
  J.neck = T(0, .356 * H, 0);
  const neckTop = T(0, .405 * H, .004 * H);
  J.QH = Q.clone().multiply(new THREE.Quaternion().setFromEuler(new THREE.Euler(-.02 - lean * .55, 0, -roll * .6)));
  J.head = neckTop.clone().add(V(0, .058 * H, .01 * H).applyQuaternion(J.QH));
  if (o.recoil) J.head.z -= o.recoil;

  // legs (the rear leg throws the roundhouse: floor -> chamber -> contact)
  J.ankle = {}; J.knee = {};
  const legLen = d.thigh + d.shin;
  for (const side of [LEFT, RIGHT]) {
    const [f, fy] = feet[side];
    let ankle = V(f.x, .045 * H, f.z);
    let pole = V(Math.sin(fy), 0, Math.cos(fy)).add(V(side * .15, 0, 0));
    const fq = new THREE.Quaternion().setFromEuler(new THREE.Euler(0, fy, 0));
    const kicking = ek > 0 && side === rearSide;
    if (kicking) {
      const hip = J.hip[side];
      const tgt = o.ribs || hip.clone().add(V(-rearX * .06 * H, .16 * H, .45 * H));
      const dir = tgt.clone().sub(hip); const dist = dir.length(); dir.normalize();
      const hit = hip.clone().addScaledVector(dir, Math.min(legLen * .9995, dist - d.foot));
      const chamber = hip.clone().add(V(rearX * .22 * H, -.05 * H, .12 * H));
      const u = ek;
      ankle = ankle.multiplyScalar((1 - u) * (1 - u)).addScaledVector(chamber, 2 * u * (1 - u)).addScaledVector(hit, u * u);
      pole = V(0, .3, 1).lerp(V(rearX * .5, 1, .15), u);
    }
    const { joint, end } = ik(J.hip[side], ankle, d.thigh, d.shin, pole);
    J.knee[side] = joint; J.ankle[side] = end;
    if (kicking) {
      const pq = new THREE.Quaternion().setFromUnitVectors(ZAX, end.clone().sub(joint).normalize());
      fq.slerp(pq, clamp(ek * 1.6, 0, 1));
    }
    J.footQ[side] = fq;
  }

  // arms
  J.elbow = {}; J.wrist = {}; J.fdir = {};
  const chin = J.head.clone().add(V(0, -.056 * H, .03 * H));
  for (const side of [LEFT, RIGHT]) {
    const sh = J.sh[side];
    let wrist, pole;
    if (guard) {
      const wLead = clamp((1 + side * s) / 2, 0, 1), isLead = wLead > .5;
      const leadT = chin.clone().add(V(side * .028 * H, .012 * H, .17 * H));
      const rearT = chin.clone().add(V(side * .056 * H, -.004 * H, .05 * H));
      wrist = rearT.lerp(leadT, wLead);
      const punch = isLead ? ej : ec, other = isLead ? ec : ej;
      if (other > 0) wrist.lerp(chin.clone().add(V(side * .05 * H, 0, .06 * H)), other * .6);
      if (punch > 0) {
        const tgt = o.face || sh.clone().add(V(0, -.02 * H, 1));
        const dir = tgt.clone().sub(sh); const dist = dir.length(); dir.normalize();
        const reach = Math.min((d.upper + d.fore) * .9995, Math.max(dist - d.hand, .05));
        wrist.lerp(sh.clone().addScaledVector(dir, reach), punch);
      }
      if (ek > 0) {
        if (!isLead) wrist.lerp(sh.clone().add(V(side * .16 * H, -(d.upper + d.fore) * .75, -.22 * H)), ek);
        else wrist.lerp(chin.clone().add(V(side * .04 * H, .012 * H, .07 * H)), ek * .7);
      }
      pole = V(side * .6, -1, -.25);
    } else if (mode === "stand") {
      wrist = sh.clone().add(V(side * .045 * H, -(d.upper + d.fore) * .965, .03 * H));
      pole = V(side * .25, 0, -1);
    } else {
      wrist = sh.clone().add(V(side * (d.upper + d.fore) * .9995, 0, 0));
      pole = V(0, 0, -1);
    }
    const { joint, end } = ik(sh, wrist, d.upper, d.fore, pole);
    J.elbow[side] = joint; J.wrist[side] = end;
    J.fdir[side] = end.clone().sub(joint).normalize();
  }
  return J;
}

function blendJ(A, B, k) {
  if (k >= 1) return B;
  if (k <= 0) return A;
  const out = { d: B.d, footQ: {} };
  for (const key of ["crotch", "neck", "head"]) out[key] = A[key].clone().lerp(B[key], k);
  out.Q = A.Q.clone().slerp(B.Q, k);
  out.QH = A.QH.clone().slerp(B.QH, k);
  for (const key of ["hip", "sh", "ankle", "knee", "elbow", "wrist", "fdir"]) {
    out[key] = {};
    for (const s of [LEFT, RIGHT]) out[key][s] = A[key][s].clone().lerp(B[key][s], k);
  }
  for (const s of [LEFT, RIGHT]) out.footQ[s] = A.footQ[s].clone().slerp(B.footQ[s], k);
  return out;
}

class Fighter {
  constructor(corner) {
    this.corner = corner;
    this.group = new THREE.Group();
    scene.add(this.group);
    this.opacity = 1;
    const c = new THREE.Color(corner);
    this.mats = {
      skin: new THREE.MeshPhysicalMaterial({ color: COL.skin, roughness: .52, sheen: 1,
        sheenRoughness: .35, sheenColor: c, clearcoat: .2, clearcoatRoughness: .55 }),
      kit: new THREE.MeshStandardMaterial({ color: c, roughness: .6, emissive: c, emissiveIntensity: .12 }),
      dark: new THREE.MeshStandardMaterial({ color: "#1E1830", roughness: .7 }),
      gold: new THREE.MeshStandardMaterial({ color: COL.rule, roughness: .35, emissive: COL.rule,
        emissiveIntensity: .85 }),
    };
    this.meshes = [];
    const m = (geo, mat) => {
      const mesh = new THREE.Mesh(geo, mat);
      mesh.matrixAutoUpdate = false;
      mesh.castShadow = true;

function cornerOf(i, f) { return f.corner || (i === 0 ? COL.a : COL.b); }

function syncFighters() {

  list.forEach((f, i) => {
    const corner = cornerOf(i, f);

// Face-off geometry. The distance is set where the longer jab just touches the other's face;

const leadOf = p => (p.lead > 0 ? LEFT : RIGHT);

  const jabJ = pp.map(p => solve(p, "guard", { ej: 1 }));
  const faceL = i => stat[i].head.clone().add(V(0, -.012 * pp[i].H, stat[i].d.headR * .9));

  const dFor = (i, j) => {
    const sh = jabJ[i].sh[leadOf(pp[i])], f = faceL(j), arm = jabJ[i].d.arm;
    const dx = -f.x - sh.x, dy = f.y - sh.y;

    const j = 1 - i, p = pp[i], rearX = p.lead > 0 ? RIGHT : LEFT;

  jab:   { P: 4.4, offB: 2.2, seq: [["ej", .5]] },
  cross: { P: 4.4, offB: 2.2, seq: [["ec", .5]] },

      opacity: 0, depthTest: false, blending: THREE.AdditiveBlending }));

// ------------------------------------------------------------------ camera framing
function frameFor(m) {
  const n = fighters.length;
  if (!n) return null;
  const maxH = Math.max(...fighters.map(f => f.target.H));
  const maxR = Math.max(...fighters.map(f => f.target.R));
  const aspect = camera.aspect || 1.4;

  } else {

  const H = F => F.p.H;
  let html = "", table = "";

  if (mode === "face") {
    const active = fighters.map((F, i) => {
      const a = env[i] || {};
      let best = null;
      for (const key of ["ej", "ec", "ek"]) if (a[key] > .5 && (!best || a[key] > a[best])) best = key;
      return best;
    });
    const lands = g => g < .015;
    const cell = g => lands(g) ? `<td class="ok">Lands</td>` : `<td class="no">${cm(g)} cm short</td>`;
    const rowOn = key => active.some(x => x === key) ? ` class="on"` : "";
    if (n > 1) {

        ["ej", "ec", "ek"].map(key => `<tr${rowOn(key)}><td>${STRIKES[key]}</td>${cell(gA[key])}${cell(gB[key])}</tr>`).join("") + `</table>`;

        .applyMatrix4(F.group.matrixWorld).add(V(0, .16, 0)));
      const sx = tops.map(t => t.clone().project(camera).x);
      fighters.forEach((F, i) => {
        const leftSide = sx[i] < sx[1 - i];
        putLabel("tag" + i, "tag", tops[i], `${name(F)}<small>${esc(F.info.stance || "")}, ${esc((F.info.hand || "").toLowerCase())}-handed</small>`,
          { color: F.corner, ax: leftSide ? -1 : 0, dx: leftSide ? 18 : -18, op: ready ? 1 : 0 });
      });
    } else {
      const F = fighters[0];
      const leadSide = leadOf(F.p);
      const power = F.hand === leadSide ? "Power hand leads, so the jab is the best weapon."
                                         : "Power hand sits at the back for the cross and the hook.";
      html = `${isYou(F) ? "Your" : possFull(F)} ${esc((F.info.stance || "orthodox").toLowerCase())} stance<span>${power} The arc on the mat is jab range.</span>`;
      table = `<table class="rt"><tr><th></th><th style="color:${F.corner}">vs same size</th></tr>` +
        ["ej", "ec", "ek"].map(key => `<tr${rowOn(key)}><td>${STRIKES[key]}</td>${cell(fo.res[0].gap[key])}</tr>`).join("") + `</table>`;
      const J = solve(F.p, "guard", {});
      putLabel("tag0", "tag", J.head.clone().applyMatrix4(F.group.matrixWorld).add(V(0, .16, 0)),
        `${name(F)}`, { color: F.corner, op: ready ? 1 : 0 });
    }
    // strike chip at the fist or foot
    fighters.forEach((F, i) => {
      const key = active[i];
      if (!key || !F.J) return;
      const g = fo.res[i].gap[key], amt = env[i][key];
      const lead = leadOf(F.p), side = key === "ej" ? lead : -lead;
      const tip = key === "ek" ? F.J.ankle[side].clone()
        : F.J.wrist[side].clone().addScaledVector(F.J.fdir[side], F.J.d.hand);
      tip.applyMatrix4(F.group.matrixWorld).add(V(0, -.07, 0));
      putLabel("hit" + i, "chip", tip, lands(g) ? `${STRIKES[key]} lands` : `${STRIKES[key]} ${cm(g)} cm short`,
        { color: lands(g) ? COL.rule : F.corner, ay: 0, op: clamp((amt - .55) * 3, 0, 1) });
    });
  }

  if (mode === "tape") {
    const xs = fighters.map(F => F.group.position.x);
    const x0 = Math.min(...xs) - .42, x1 = Math.max(...xs) + .42;
    fighters.forEach((F, i) => {
      const y = H(F);
      line("h" + i, V(x0, y, -.12), V(x1, y, -.12), F.corner, true, .9);
      const below = n > 1 && i === (H(fighters[0]) >= H(fighters[1]) ? 1 : 0);
      putLabel("hv" + i, "val", V(x1 + .03, y, -.12), `${cm(y)} cm`,
        { color: F.corner, ax: 0, ay: -.5, dy: below ? 9 : -9, op: ready ? 1 : 0 });
      putLabel("tag" + i, "tag", V(F.group.position.x, -.02, .1), `${name(F)}<small>${Math.round(F.target.W)} kg, ape index ${fmtSigned(cm(F.p.R - F.p.H))} cm</small>`,
        { color: F.corner, ay: 0, op: ready ? 1 : 0 });
    });
    if (n > 1) {
      const [A, B] = fighters;
      const dh = cm(A.p.H - B.p.H), dw = Math.round(A.target.W - B.target.W);
      const T = dh >= 0 ? A : B, S = dh >= 0 ? B : A;
      html = Math.abs(dh) < 1
        ? `Same height<span>${weightLine(A, B, dw)}</span>`
        : `${who(T)} ${vb(T, "stands", "stand")} ${Math.abs(dh)} cm taller<span>${weightLine(A, B, dw)}</span>`;
      line("dh", V(x1 - .05, A.p.H, -.12), V(x1 - .05, B.p.H, -.12), COL.rule);
    } else {
      const F = fighters[0];
      html = `${cm(F.p.H)} cm, ${Math.round(F.target.W)} kg<span>BMI ${(F.target.W / (F.p.H * F.p.H)).toFixed(1)}. The body model widens with weight relative to height.</span>`;
    }
  }

  if (mode === "reach") {
    const top = Math.max(...fighters.map(H));
    fighters.forEach((F, i) => {
      const y = top + .1 + .17 * i, half = F.p.R / 2;
      const shY = .815 * F.p.H - .004 * F.p.H;
      line("r" + i, V(-half, y, 0), V(half, y, 0), F.corner);
      line("rl" + i, V(-half, y + .025, 0), V(-half, y - .025, 0), F.corner);
      line("rr" + i, V(half, y + .025, 0), V(half, y - .025, 0), F.corner);
      line("dl" + i, V(-half, y, 0), V(-half, shY, 0), F.corner, true, .7);
      line("dr" + i, V(half, y, 0), V(half, shY, 0), F.corner, true, .7);
      putLabel("rv" + i, "val", V(0, y, 0), `${n > 1 ? name(F) + " " : "Reach "}${cm(F.p.R)} cm`,
        { color: F.corner, ay: -1, dy: -4, op: ready ? 1 : 0 });
    });
    if (n > 1) {
      const [A, B] = fighters;
      const dr = cm(A.p.R - B.p.R);
      const Lf = dr >= 0 ? A : B;
      html = Math.abs(dr) < 1
        ? `Matching arm span<span>Ape index (reach minus height): ${apeLine(A)}, ${apeLine(B)}.</span>`
        : `${possFull(Lf)} arms span ${Math.abs(dr)} cm wider<span>Ape index (reach minus height): ${apeLine(A)}, ${apeLine(B)}. The translucent figure is ${isYou(B) ? "you" : esc(B.info.label || "corner B")}.</span>`;
    } else {
      const F = fighters[0];
      const ape = cm(F.p.R - F.p.H);
      const x = F.p.R / 2 + .14;
      line("hgt", V(x, 0, 0), V(x, F.p.H, 0), COL.rule);
      line("hgt2", V(x - .025, F.p.H, 0), V(x + .025, F.p.H, 0), COL.rule);
      putLabel("hgtv", "val", V(x + .03, F.p.H * .5, 0), `Height ${cm(F.p.H)} cm`,
        { color: COL.rule, ax: 0, ay: -.5, op: ready ? 1 : 0 });
      html = `Reach ${cm(F.p.R)} cm<span>Ape index ${fmtSigned(ape)} cm: arms ${ape >= 4 ? "longer than" : ape <= -4 ? "shorter than" : "about the same as"} height${ape >= 4 ? ", an edge at range" : ""}.</span>`;
    }
  }
  if (html !== headHTML) { head.innerHTML = html; headHTML = html; }
  if (table !== tableHTML) { rangeEl.innerHTML = table; tableHTML = table; }
  endLabels(); endSegs();
}
const fmtSigned = v => (v > 0 ? "+" : v < 0 ? "−" : "") + Math.abs(v);
const apeLine = F => `${short_(F)} ${fmtSigned(cm(F.p.R - F.p.H))} cm`;
const weightLine = (A, B, dw) => Math.abs(dw) < 1
  ? "Same weight on the scale."
  : (F => `${isYou(F) ? "You carry" : short_(F) + " carries"} ${Math.abs(dw)} kg more.`)(dw > 0 ? A : B);

// ------------------------------------------------------------------ UI
const btn = { face: document.getElementById("mFace"), tape: document.getElementById("mTape"),
              reach: document.getElementById("mReach") };
function setMode(m) {
  if (m === mode) return;
  prevMode = mode; mode = m; modeT = 0;
  for (const [key, b] of Object.entries(btn)) b.classList.toggle("on", key === m);
  document.getElementById("strikes").style.display = m === "face" ? "" : "none";
  flyTo(m);
}
function setStrike(k) {
  strikeSel = k;
  for (const b of document.querySelectorAll("#strikes button")) b.classList.toggle("on", b.dataset.k === k);
}
for (const b of document.querySelectorAll("#strikes button")) b.onclick = () => { setStrike(b.dataset.k); time = 0; };
btn.face.onclick = () => setMode("face");
btn.tape.onclick = () => setMode("tape");
btn.reach.onclick = () => setMode("reach");
const bSpin = document.getElementById("bSpin");
const syncSpin = () => bSpin.classList.toggle("on", controls.autoRotate);
bSpin.onclick = () => { controls.autoRotate = !controls.autoRotate; syncSpin(); };
document.getElementById("bReset").onclick = () => flyTo(mode);
controls.addEventListener("start", () => { camTween = null; });

function resize() {
  const w = wrap.clientWidth, h = wrap.clientHeight;
  if (!w || !h) return;
  renderer.setSize(w, h, false);
  renderer.domElement.style.width = w + "px";
  renderer.domElement.style.height = h + "px";
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
new ResizeObserver(() => { resize(); }).observe(wrap);

// ------------------------------------------------------------------ inputs
window.addEventListener("message", (e) => {
  const d = e.data;
  if (!d || d.type !== "streamlit:render") return;
  const args = d.args || {};
  frameHeight = args.height || 520;
  wrap.style.height = frameHeight + "px";
  send("streamlit:setFrameHeight", { height: frameHeight });
  figs = args.figures || [];
  const countChanged = figs.length !== fighters.length;
  syncFighters();
  resize();
  if (firstRender) {
    const p = args.pose;
    const m = p === "tpose" || p === "reach" ? "reach" : p === "stand" || p === "tape" ? "tape" : "face";
    mode = prevMode = m;
    for (const [key, b] of Object.entries(btn)) b.classList.toggle("on", key === m);
    document.getElementById("strikes").style.display = m === "face" ? "" : "none";
    if (args.strike && SCHED[args.strike]) setStrike(args.strike);
    if (args.autorotate === false || REDUCE) controls.autoRotate = false;
    syncSpin();
    flyTo(mode, true);
    firstRender = false;
  } else if (countChanged) {
    flyTo(mode);
  }
});

if (window.parent === window) {
  const demo = location.hash ? JSON.parse(decodeURIComponent(location.hash.slice(1))) : {
    figures: [
      { label: "Conor McGregor", height_cm: 175, weight_kg: 70, reach_cm: 188, stance: "Southpaw", hand: "Right", foot: "Right" },
      { label: "Khabib Nurmagomedov", height_cm: 178, weight_kg: 70, reach_cm: 178, stance: "Orthodox", hand: "Right", foot: "Left", ghost: true }] };
  window.postMessage({ type: "streamlit:render", args: { height: window.innerHeight, ...demo } }, "*");
} else {
  send("streamlit:componentReady", { apiVersion: 1 });
}
</script>
</body>
