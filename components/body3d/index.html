<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Body 3D</title>
<style>
  @font-face { font-family: "Instrument Sans"; src: url("/app/static/fonts/instrument-sans-latin-400-normal.woff2") format("woff2"); font-weight: 400; }
  @font-face { font-family: "Instrument Sans"; src: url("/app/static/fonts/instrument-sans-latin-600-normal.woff2") format("woff2"); font-weight: 600; }
  @font-face { font-family: "Big Shoulders Display"; src: url("/app/static/fonts/big-shoulders-display-latin-700-normal.woff2") format("woff2"); font-weight: 700; }
  @font-face { font-family: "Big Shoulders Display"; src: url("/app/static/fonts/big-shoulders-display-latin-800-normal.woff2") format("woff2"); font-weight: 800; }
  :root { --bg:#0C0C0E; --ink:#F2F0ED; --ink2:#C4C1BC; --mute:#8F8C88; --line:#2A2A2F;
          --a:#F04A3E; --afill:#C42A20; --b:#A7ADB8; --rule:#E9B44C; }
  html, body { margin:0; height:100%; background:var(--bg); overflow:hidden; color:var(--ink);
               font-family:"Instrument Sans", "Segoe UI", system-ui, sans-serif; }
  #wrap { position:relative; width:100%; height:100%; overflow:hidden; box-sizing:border-box;
          border:1px solid var(--line); border-radius:6px;
          background: radial-gradient(120% 85% at 50% 8%, #1C1C20 0%, #111113 52%, #0A0A0B 100%); }
  canvas { display:block; position:absolute; inset:0; }
  #labels { position:absolute; inset:0; pointer-events:none; overflow:hidden; }
  .lab { position:absolute; left:0; top:0; white-space:nowrap; will-change:transform; transition:opacity .2s; }
  .tag.l { text-align:right; }
  .tag { font-family:"Big Shoulders Display", sans-serif; font-weight:700; font-size:17px; line-height:1;
         text-align:center; text-shadow:0 0 3px #000, 0 0 8px #000, 0 1px 12px rgba(0,0,0,.9); }
  .tag small { display:block; font-family:"Instrument Sans", sans-serif; font-weight:400; font-size:11.5px;
               color:var(--ink2); margin-top:3px; }
  .chip { font-size:12px; font-weight:600; padding:3px 8px; border-radius:3px; line-height:1.2;
          background:rgba(12,12,14,.88); border:1px solid currentColor; }
  .val { font-family:"Big Shoulders Display", sans-serif; font-weight:700; font-size:15px;
         text-shadow:0 0 3px #000, 0 0 8px #000; }
  .hud { position:absolute; top:12px; left:14px; right:14px; pointer-events:none; display:flex;
         justify-content:space-between; align-items:flex-start; gap:14px; }
  .head { flex:1 1 auto; min-width:0; }
  .rt { border-collapse:collapse; font-size:12px; background:rgba(12,12,14,.78); border:1px solid var(--line);
        border-radius:4px; }
  .rt th, .rt td { padding:4px 9px; text-align:left; white-space:nowrap; }
  .rt th { font-family:"Big Shoulders Display", sans-serif; font-weight:700; font-size:14px; padding-top:6px; }
  .rt td:first-child { color:var(--ink2); }
  .rt tr.on td { background:rgba(233,180,76,.13); }
  .rt td.ok { color:var(--rule); font-weight:600; }
  .rt td.no { color:var(--mute); }
  .head { font-family:"Big Shoulders Display", sans-serif; font-weight:800; font-size:23px; line-height:1.05;
          max-width:560px; text-wrap:balance; }
  .head span { display:block; font-family:"Instrument Sans", sans-serif; font-weight:400; font-size:12.5px;
               line-height:1.4; color:var(--ink2); margin-top:5px; max-width:460px; }
  .bar { position:absolute; left:12px; right:12px; bottom:12px; display:flex; align-items:center;
         gap:6px; flex-wrap:wrap; }
  .seg { display:inline-flex; border:1px solid var(--line); border-radius:4px; overflow:hidden;
         background:rgba(20,20,23,.9); }
  .seg button, .tool { all:unset; cursor:pointer; font-size:12px; padding:6px 9px; color:var(--ink2); }
  .seg button + button { border-left:1px solid var(--line); }
  .seg button.on { background:var(--afill); color:#fff; font-weight:600; }
  .seg button, .tool { min-height:28px; box-sizing:border-box; }
  canvas:focus-visible { outline:2px solid var(--rule); outline-offset:-2px; }
  .sr-only { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
  .tool { padding:6px 9px; color:var(--ink2); background:rgba(20,20,23,.9); border:1px solid var(--line); border-radius:4px; }
  .tool.on { color:var(--ink); border-color:#4A4A52; }
  .seg button:focus-visible, .tool:focus-visible { outline:2px solid var(--rule); outline-offset:-2px; }
  .spacer { flex:1; }
  .key { font-size:11.5px; color:var(--ink2); }
  .key i { display:inline-block; width:14px; height:4px; border-radius:2px; margin-right:6px;
           vertical-align:middle; background:var(--rule); box-shadow:0 0 6px var(--rule); }
  @media (max-width: 900px) { .key { display:none; } }
  @media (max-width: 640px) { .seg button, .tool { padding:5px 7px; font-size:11.5px; } .bar { gap:4px; left:8px; right:8px; } }
  @media (max-width: 600px) { .head { font-size:19px; } .head span { display:none; } .rt { font-size:11px; }
                              .seg button, .tool { padding:5px 8px; font-size:12px; } }
</style>
<script type="importmap">
  { "imports": { "three": "./three.module.min.js" } }
</script>
</head>
<body>
<div id="wrap">
  <p class="sr-only" id="kbd">Focus the 3D view and use the arrow keys to turn it and plus or minus to zoom.</p>
  <div id="labels"></div>
  <div class="hud"><div class="head" id="head"></div><div id="range"></div></div>
  <div class="bar">
    <div class="seg" role="group" aria-label="View">
      <button id="mFace" class="on" aria-pressed="true">Face-off</button>
      <button id="mTape" aria-pressed="false">Height</button>
      <button id="mReach" aria-pressed="false">Reach</button>
    </div>
    <div class="seg" role="group" aria-label="Strike" id="strikes">
      <button data-k="spar" class="on" aria-pressed="true">Spar</button>
      <button data-k="jab" aria-pressed="false">Jab</button>
      <button data-k="cross" aria-pressed="false">Cross</button>
      <button data-k="kick" aria-pressed="false">Kick</button>
    </div>
    <button class="tool on" id="bPlay" aria-pressed="true">Pause</button>
    <button class="tool on" id="bSpin" aria-pressed="true">Rotate</button>
    <button class="tool" id="bReset">Reset</button>
    <span class="spacer"></span>
    <span class="key"><i></i>Gold strap patch and ankle band mark the dominant hand and foot</span>
  </div>
</div>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "./OrbitControls.js";
import { GLTFLoader } from "./jsm/GLTFLoader.js";
import * as SkeletonUtils from "./jsm/SkeletonUtils.js";

// ------------------------------------------------------------------ bridge
const send = (type, data = {}) =>
  window.parent.postMessage({ isStreamlitMessage: true, type, ...data }, "*");
let frameHeight = 520;

const COL = { a: "#F04A3E", b: "#A7ADB8", rule: "#E9B44C", skin: "#a26c50", ink: "#F2F0ED", hit: "#FF6A4D" };
const KIT = { "#F04A3E": "#C8291C", "#A7ADB8": "#B4B9C2" };   // fight-kit fabric per corner
const REDUCE = matchMedia("(prefers-reduced-motion: reduce)").matches;
const V = (x = 0, y = 0, z = 0) => new THREE.Vector3(x, y, z);
const UP = V(0, 1, 0), ZAX = V(0, 0, 1);
const clamp = (x, a, b) => Math.min(Math.max(x, a), b);
const ease = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const easeOut = t => 1 - Math.pow(1 - t, 3);
const cm = m => Math.round(m * 100);
const TXT = c => c;   // both corner colours pass 4.5:1 as text on the stage
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const first = s => String(s).split(" ").slice(-1)[0];
const isYou = F => String(F.info.label || "").trim().toLowerCase() === "you";
const who = F => isYou(F) ? "You" : esc(F.info.label || "Fighter");            // sentence subject
const short_ = F => isYou(F) ? "you" : esc(first(F.info.label || "Fighter"));
const poss = (F, cap = false) => isYou(F) ? (cap ? "Your" : "your") : esc(first(F.info.label || "Fighter")) + "'s";
const possFull = F => isYou(F) ? "Your" : esc(F.info.label || "Fighter") + "'s";
const vb = (F, s3, base) => isYou(F) ? base : s3;

// ------------------------------------------------------------------ renderer / scene
const wrap = document.getElementById("wrap");
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setClearColor(0x000000, 0);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
wrap.prepend(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(30, 1, 0.05, 60);
const controls = new OrbitControls(camera, renderer.domElement);
// keyboard orbit for the canvas (WCAG 2.1.1): arrows turn, +/- zoom
function keyOrbit(el, onKey) {
  el.tabIndex = 0;
  el.addEventListener("keydown", (e) => {
    const sph = new THREE.Spherical().setFromVector3(camera.position.clone().sub(controls.target));
    const step = 0.12;
    if (e.key === "ArrowLeft") sph.theta -= step;
    else if (e.key === "ArrowRight") sph.theta += step;
    else if (e.key === "ArrowUp") sph.phi = Math.max(0.2, sph.phi - step);
    else if (e.key === "ArrowDown") sph.phi = Math.min(controls.maxPolarAngle, sph.phi + step);
    else if (e.key === "+" || e.key === "=") sph.radius = Math.max(controls.minDistance, sph.radius * 0.9);
    else if (e.key === "-") sph.radius = Math.min(controls.maxDistance, sph.radius * 1.1);
    else return;
    e.preventDefault();
    if (onKey) onKey();
    camera.position.copy(controls.target).add(new THREE.Vector3().setFromSpherical(sph));
    controls.update();
  });
}keyOrbit(renderer.domElement, () => { camTween = null; });
renderer.domElement.setAttribute("role", "img");
renderer.domElement.setAttribute("aria-describedby", "kbd");
controls.enableDamping = true;
controls.autoRotateSpeed = 0.7;
controls.minDistance = 1.4;
controls.maxDistance = 14;
controls.maxPolarAngle = Math.PI * 0.52;
controls.autoRotate = !REDUCE;

scene.fog = new THREE.Fog("#0C0C0E", 6.5, 17);
let ENV = null;
// arena reflections: a dark room with an overhead softbox and two red corner panels, prefiltered
// once so skin, gloves and shorts pick up believable highlights (the stage background stays dark)
{
  const env = new THREE.Scene();
  env.add(new THREE.Mesh(new THREE.BoxGeometry(20, 12, 20),
    new THREE.MeshBasicMaterial({ color: "#121214", side: THREE.BackSide })));
  const panel = (w, h, color, k, pos, look) => {
    const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ color: new THREE.Color(color).multiplyScalar(k), side: THREE.DoubleSide }));
    m.position.set(...pos); m.lookAt(...look); env.add(m);
  };
  panel(6, 6, "#fff4e8", 6, [0, 5.8, 0], [0, 0, 0]);
  panel(3, 4, "#ff4a36", 2.5, [-8, 2.5, -6], [0, 1, 0]);
  panel(3, 4, "#ff4a36", 2, [-8, 2.5, 6], [0, 1, 0]);
  panel(4, 3, "#c9d4e6", 1.5, [9, 2, 2], [0, 1, 0]);
  const pmrem = new THREE.PMREMGenerator(renderer);
  ENV = pmrem.fromScene(env, 0.04).texture;          // used by the fighters' materials only
  pmrem.dispose();
}
scene.add(new THREE.HemisphereLight("#d6d8de", "#2a0d0b", 0.35));
const spot = new THREE.SpotLight("#fff3e6", 6.5, 0, 0.55, 0.85, 0);
spot.position.set(0.8, 7, 1.4);
spot.target.position.set(0, 0.9, 0);
spot.castShadow = true;
spot.shadow.mapSize.set(2048, 2048);
spot.shadow.bias = -0.0004;
spot.shadow.camera.near = 2; spot.shadow.camera.far = 14;
scene.add(spot, spot.target);
const rimA = new THREE.DirectionalLight("#FF5040", 2.4); rimA.position.set(-3, 2.4, -4.5); scene.add(rimA);
const rimB = new THREE.DirectionalLight("#FF6450", 1.6); rimB.position.set(-3, 2.4, 4.5); scene.add(rimB);
const fill = new THREE.DirectionalLight("#c9d4e6", 1.1); fill.position.set(5, 2, 1); scene.add(fill);
const glow = new THREE.PointLight("#FF2A1A", 0.45, 5, 1.8); glow.position.set(0, 0.25, 0); scene.add(glow);

// ---- stage: black floor with a red neon grid that fades into the dark
const MAT_R = 3.0;
// glowing grid drawn into a texture so the lines stay crisp at grazing angles
function gridTexture() {
  const c = document.createElement("canvas"); c.width = c.height = 256;
  const g = c.getContext("2d");
  g.fillStyle = "#000"; g.fillRect(0, 0, 256, 256);
  for (const [w, a] of [[18, .10], [9, .22], [4, .55], [2, 1]]) {
    g.strokeStyle = `rgba(255, 62, 44, ${a})`; g.lineWidth = w;
    g.beginPath(); g.moveTo(0, 0); g.lineTo(256, 0); g.moveTo(0, 0); g.lineTo(0, 256);
    g.moveTo(0, 256); g.lineTo(256, 256); g.moveTo(256, 0); g.lineTo(256, 256); g.stroke();
  }
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(60 / 0.8, 60 / 0.8);                  // 80 cm cells
  t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
const floor = new THREE.Mesh(new THREE.PlaneGeometry(60, 60),
  new THREE.MeshStandardMaterial({ color: "#070708", roughness: 0.95, metalness: 0,
    emissive: "#ffffff", emissiveMap: gridTexture(), emissiveIntensity: 0.9 }));
floor.rotation.x = -Math.PI / 2;
floor.receiveShadow = true;
scene.add(floor);
function octLoop(r, color, opacity = 1) {
  const pts = [];
  for (let k = 0; k <= 8; k++) {
    const a = Math.PI / 8 + k * Math.PI / 4;
    pts.push(V(r * Math.cos(a), 0.004, r * Math.sin(a)));
  }
  return new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),
    new THREE.LineBasicMaterial({ color, transparent: true, opacity }));
}
scene.add(octLoop(MAT_R, "#FF6A4D", 0.9));
const postGeo = new THREE.CylinderGeometry(0.05, 0.05, 0.3, 16);
for (let k = 0; k < 8; k++) {
  const a = Math.PI / 8 + k * Math.PI / 4;
  const isA = k === 5, isB = k === 1;
  const c = isA ? COL.a : isB ? COL.b : "#2A2A2F";
  const post = new THREE.Mesh(postGeo, new THREE.MeshStandardMaterial({
    color: c, roughness: 0.5, emissive: c, emissiveIntensity: isA || isB ? 0.9 : 0.05 }));
  post.position.set(MAT_R * Math.cos(a), 0.15, MAT_R * Math.sin(a));
  scene.add(post);
}

// ------------------------------------------------------------------ body model
// fighter.glb: MakeHuman CC0 base mesh shaped into an athletic male, built by
// scripts/build_body_model.py. Proportions below are measured from its skeleton once it loads.
const ANAT = { crotch: .47, crotchZ: .005, hipX: .052, hipUp: .035, hipZ: .005, sj: .1, shUp: .345, shZ: 0,
               neckUp: .356, neckZ: 0, headBoneUp: .405, headBoneZ: .004, headUp: .058, headZ: .01,
               ankle: .045, thigh: .225, shin: .235, upper: .176, fore: .144, hand: .08 };
let MODEL = null;
const nm = s => s.replace(/\./g, "");            // GLTFLoader strips dots from node names

function buildModel(gltf) {
  const root = gltf.scene, ext = gltf.parser.json.extras;
  root.updateMatrixWorld(true);
  const Hm = ext.height, y0 = ext.floor;
  const bone = n => root.getObjectByName(nm(n));
  const wp = n => V().setFromMatrixPosition(bone(n).matrixWorld);
  const mid = (a, b) => wp(a).add(wp(b)).multiplyScalar(.5);
  const hip = mid("upperleg01.L", "upperleg01.R"), sh = mid("upperarm01.L", "upperarm01.R");
  const neck = wp("neck01"), headB = wp("head");
  const eyes = V(...ext.eyes.L).add(V(...ext.eyes.R)).multiplyScalar(.5);
  const headC = eyes.clone().add(V(0, .004, -.078));
  ANAT.hipUp = .035;
  ANAT.crotch = (hip.y - y0) / Hm - ANAT.hipUp;
  ANAT.crotchZ = hip.z / Hm - .005;
  ANAT.hipX = (wp("upperleg01.L").x - wp("upperleg01.R").x) / 2 / Hm;
  const up = v => (v.y - y0) / Hm - ANAT.crotch, fz = v => v.z / Hm - ANAT.crotchZ;
  ANAT.sj = (wp("upperarm01.L").x - wp("upperarm01.R").x) / 2 / Hm;
  ANAT.shUp = up(sh); ANAT.shZ = fz(sh);
  ANAT.neckUp = up(neck); ANAT.neckZ = fz(neck);
  ANAT.headBoneUp = up(headB); ANAT.headBoneZ = fz(headB);
  ANAT.headUp = (headC.y - headB.y) / Hm; ANAT.headZ = (headC.z - headB.z) / Hm;
  ANAT.ankle = (wp("foot.L").y - y0) / Hm;
  ANAT.thigh = wp("upperleg01.L").distanceTo(wp("lowerleg01.L")) / Hm;
  ANAT.shin = wp("lowerleg01.L").distanceTo(wp("foot.L")) / Hm;
  ANAT.upper = wp("upperarm01.L").distanceTo(wp("lowerarm01.L")) / Hm;
  ANAT.fore = wp("lowerarm01.L").distanceTo(wp("wrist.L")) / Hm;
  ANAT.hand = ext.fist.L / Hm;
  const order = [], parentOf = {}, restLocal = {}, restWorld = {}, restPos = {};
  root.traverse(o => {
    if (!o.isBone) return;
    order.push(o.name);
    parentOf[o.name] = o.parent && o.parent.isBone ? o.parent.name : null;
    restLocal[o.name] = o.quaternion.clone();
    restPos[o.name] = o.position.clone();
    restWorld[o.name] = new THREE.Quaternion().setFromRotationMatrix(new THREE.Matrix4().extractRotation(o.matrixWorld));
  });
  const hand = {};
  for (const s of ["L", "R"]) {
    const w = bone("wrist." + s);
    const f0 = V(0, 1, 0).applyQuaternion(restWorld[w.name]);
    const b0 = V(...w.userData.palm).negate();
    b0.addScaledVector(f0, -b0.dot(f0)).normalize();
    hand[s] = new THREE.Quaternion().setFromRotationMatrix(new THREE.Matrix4().makeBasis(b0.clone().cross(f0), b0, f0));
  }
  const headInv = new THREE.Matrix4().copy(bone("head").matrixWorld).invert();
  paintSkin(root, ext);
  return { scene: root, Hm, floor: y0, order, parentOf, restLocal, restWorld, restPos, hand,
           restRoot: wp("root"), restHip: hip,
           eyeLocal: ["L", "R"].map(s => V(...ext.eyes[s]).applyMatrix4(headInv)),
           eyeFwd: V(0, 0, 1).transformDirection(headInv) };
}

// Per-vertex detail for the skin, computed once from the bind pose (no textures: the mesh has no UVs).
//   ao:    ambient occlusion from surface curvature, so muscle separations, collarbones and
//          creases read as shape instead of flat plastic;
//   hair:  0..1 mask for a short fade haircut and eyebrows, coloured in the skin shader.
function paintSkin(root, ext) {
  const body = root.getObjectByName("body");
  if (!body || !body.geometry.index) return;
  const g = body.geometry, P = g.attributes.position, Nr = g.attributes.normal, n = P.count;
  const ix = g.index.array;
  const nb = Array.from({ length: n }, () => new Set());
  for (let i = 0; i < ix.length; i += 3) {
    const a = ix[i], b = ix[i + 1], c = ix[i + 2];
    nb[a].add(b).add(c); nb[b].add(a).add(c); nb[c].add(a).add(b);
  }
  const pos = i => V(P.getX(i), P.getY(i), P.getZ(i));
  const nrm = i => V(Nr.getX(i), Nr.getY(i), Nr.getZ(i));
  // signed curvature: > 0 where the neighbours sit in front of the vertex (a crease)
  const cav = new Float32Array(n);
  for (let i = 0; i < n; i++) {
    if (!nb[i].size) continue;
    const p = pos(i), avg = V();
    let edge = 0;
    for (const j of nb[i]) { const q = pos(j); avg.add(q); edge += q.distanceTo(p); }
    avg.multiplyScalar(1 / nb[i].size);
    cav[i] = avg.sub(p).dot(nrm(i)) / (edge / nb[i].size + 1e-6);
  }
  const blur = (src, it) => {
    let a = src;
    for (let k = 0; k < it; k++) {
      const b = new Float32Array(n);
      for (let i = 0; i < n; i++) {
        let s = a[i];
        for (const j of nb[i]) s += a[j];
        b[i] = s / (nb[i].size + 1);
      }
      a = b;
    }
    return a;
  };
  const fine = blur(cav, 2), broad = blur(cav, 14);
  const ao = new Float32Array(n);
  for (let i = 0; i < n; i++)
    ao[i] = clamp(1 - 2.4 * Math.max(broad[i], 0) - .8 * Math.max(fine[i], 0), .4, 1);
  g.setAttribute("ao", new THREE.BufferAttribute(ao, 1));

  // hair: fade haircut on the scalp, eyebrows over each eye
  const SI = g.attributes.skinIndex, SW = g.attributes.skinWeight;
  const hb = body.skeleton ? body.skeleton.bones.findIndex(b => b.name === "head") : -1;
  const E = V(...ext.eyes.L).add(V(...ext.eyes.R)).multiplyScalar(.5);
  const ex = [ext.eyes.L[0], ext.eyes.R[0]];
  const ss = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
  const hair = new Float32Array(n);
  for (let i = 0; i < n; i++) {
    let wHead = 0;
    if (hb >= 0) for (let k = 0; k < 4; k++) if (SI.getComponent(i, k) === hb) wHead += SW.getComponent(i, k);
    if (wHead < .35) continue;
    const dx = P.getX(i), dy = P.getY(i) - E.y, dz = P.getZ(i) - E.z, nz = Nr.getZ(i);
    // hairline: high at the forehead, above the ears at the sides, down to the nape at the back
    let line = THREE.MathUtils.lerp(.06, .032, ss(-.025, -.08, dz));
    line = THREE.MathUtils.lerp(line, -.07, ss(-.115, -.165, dz));
    let h = ss(line - .004, line + .01, dy);
    const ear = Math.abs(dx) > .062 && dz > -.125 && dz < -.055 && dy < .035;
    if (ear) h *= 1 - ss(.062, .068, Math.abs(dx));
    h *= .55 + .45 * ss(line, line + .05, dy);                     // fade: shorter at the sides
    for (const x0 of ex) {
      const u = (dx - x0) / .028;                                  // -1..1 across the brow
      if (Math.abs(u) > 1 || nz < .25) continue;
      const mid = .019 + .004 * (1 - u * u);                       // gentle arch
      const brow = (1 - ss(.55, 1, Math.abs(u))) * (1 - ss(.0035, .0065, Math.abs(dy - mid)));
      h = Math.max(h, .9 * brow);
    }
    hair[i] = h;
  }
  g.setAttribute("hair", new THREE.BufferAttribute(hair, 1));
}

// Skin: physical material plus procedural pores (bump from noise on the bind-pose position),
// a hair layer driven by the "hair" attribute, and the curvature occlusion from "ao".
const SKIN_GLSL = `
varying vec3 vObj;
varying float vHair;
varying float vAO;
uniform vec3 uHairColor;
float h31(vec3 p) { p = fract(p * .1031); p += dot(p, p.zyx + 31.32); return fract((p.x + p.y) * p.z); }
float vnoise(vec3 x) {
  vec3 i = floor(x), f = fract(x); f = f * f * (3. - 2. * f);
  return mix(mix(mix(h31(i), h31(i + vec3(1,0,0)), f.x), mix(h31(i + vec3(0,1,0)), h31(i + vec3(1,1,0)), f.x), f.y),
             mix(mix(h31(i + vec3(0,0,1)), h31(i + vec3(1,0,1)), f.x), mix(h31(i + vec3(0,1,1)), h31(i + vec3(1,1,1)), f.x), f.y), f.z);
}
vec3 perturbSkin(vec3 surf_pos, vec3 surf_norm, vec2 dHdxy, float faceDir) {
  vec3 sx = normalize(dFdx(surf_pos)), sy = normalize(dFdy(surf_pos));
  vec3 r1 = cross(sy, surf_norm), r2 = cross(surf_norm, sx);
  float det = dot(sx, r1) * faceDir;
  return normalize(abs(det) * surf_norm - sign(det) * (dHdxy.x * r1 + dHdxy.y * r2));
}`;
function skinMaterial(color) {
  const m = new THREE.MeshPhysicalMaterial({ color, roughness: .52, metalness: 0,
    specularIntensity: .55, sheen: .35, sheenRoughness: .6, sheenColor: new THREE.Color("#e8a08a"),
    clearcoat: .08, clearcoatRoughness: .35 });
  m.userData.hair = { value: new THREE.Color("#17110d") };
  m.onBeforeCompile = (sh) => {
    sh.uniforms.uHairColor = m.userData.hair;
    sh.vertexShader = sh.vertexShader
      .replace("#include <common>", "#include <common>\nattribute float hair;\nattribute float ao;\nvarying vec3 vObj;\nvarying float vHair;\nvarying float vAO;")
      .replace("#include <begin_vertex>", "#include <begin_vertex>\nvObj = position;\nvHair = hair;\nvAO = ao;");
    sh.fragmentShader = sh.fragmentShader
      .replace("#include <common>", "#include <common>\n" + SKIN_GLSL)
      .replace("#include <color_fragment>", `#include <color_fragment>
        float px = length(fwidth(vObj));                           // metres per pixel
        // fade each noise octave out before its cells shrink to a pixel (no sparkle at a distance)
        float lodC = clamp((.35 - px * 140.) / .25, 0., 1.);
        float lod = clamp((.35 - px * 700.) / .25, 0., 1.);
        float lodF = clamp((.35 - px * 1500.) / .25, 0., 1.);
        float stub = mix(.5, vnoise(vObj * 1500.), lodF);
        float hairAmt = clamp(vHair * (.72 + .5 * stub), 0., 1.);
        diffuseColor.rgb = mix(diffuseColor.rgb, uHairColor * (.8 + .4 * stub), hairAmt);
        diffuseColor.rgb *= mix(1., vAO, .3);                       // a little cavity darkening under direct light`)
      .replace("#include <aomap_fragment>", `#include <aomap_fragment>
        reflectedLight.indirectDiffuse *= vAO;                      // full occlusion for ambient and reflections
        reflectedLight.indirectSpecular *= vAO * vAO;`)
      .replace("#include <roughnessmap_fragment>", `#include <roughnessmap_fragment>
        float pore = mix(.5, vnoise(vObj * 700.), lod), grain = mix(.5, vnoise(vObj * 1500.), lodF);
        roughnessFactor = clamp(roughnessFactor + .14 * (pore - .5) + .06 * (grain - .5), .3, .8);
        roughnessFactor = mix(roughnessFactor, .9, hairAmt);`)
      .replace("#include <normal_fragment_maps>", `#include <normal_fragment_maps>
        float bh = .35 * lod * vnoise(vObj * 700.) + .2 * lodF * vnoise(vObj * 1500.) + .5 * lodC * vnoise(vObj * 140.);
        normal = perturbSkin(-vViewPosition, normal, vec2(dFdx(bh), dFdy(bh)) * mix(.35, .7, hairAmt), faceDirection);`);
  };
  return m;
}

// ------------------------------------------------------------------ fighter
const LEFT = 1, RIGHT = -1;          // +x is the fighter's own left side
const sideOf = s => (s === "Left" ? LEFT : RIGHT);

function params(f) {
  const H = clamp((f.height_cm || 175) / 100, 1.4, 2.2);
  const R = clamp((f.reach_cm || f.height_cm || 175) / 100, 1.3, 2.4);
  const W = clamp(f.weight_kg || 70, 40, 150);
  return { H, R, W, g: clamp(Math.sqrt(W / (H * H) / 23), 0.82, 1.42),
           lead: f.stance === "Southpaw" ? RIGHT : LEFT };
}

function dims(p) {
  const H = p.H, sj = ANAT.sj * H, hand = ANAT.hand * H;
  const nat = (ANAT.upper + ANAT.fore) * H;                  // shoulder to wrist on the model
  const sa = clamp((p.R / 2 - sj - hand) / nat, .85, 1.2);   // arm stretch that gives this reach
  return { H, sj, sa, arm: nat * sa + hand, upper: ANAT.upper * H * sa, fore: ANAT.fore * H * sa, hand,
           thigh: ANAT.thigh * H, shin: ANAT.shin * H, foot: .05 * H, headR: .062 * H };
}

function ik(a, target, l1, l2, pole) {
  const d = target.clone().sub(a);
  const dist = clamp(d.length(), 1e-4, (l1 + l2) * 0.9995);
  const dir = d.normalize();
  const end = a.clone().addScaledVector(dir, dist);
  const x = (l1 * l1 - l2 * l2 + dist * dist) / (2 * dist);
  const h = Math.sqrt(Math.max(l1 * l1 - x * x, 0));
  const perp = pole.clone().addScaledVector(dir, -pole.dot(dir));
  if (perp.lengthSq() < 1e-8) perp.set(0, 0, -1);
  perp.normalize();
  return { joint: a.clone().addScaledVector(dir, x).addScaledVector(perp, h), end };
}

// Pose solver: joint positions in the fighter's local frame (faces +z, +x = own left).
// Strike amounts 0..1: ej jab, ec cross, eh lead hook, eu rear uppercut, ek rear body kick,
// elk rear leg kick, et lead teep. Defence: slip (-1..1 sideways), cover, check, roll.
// Targets (local): jabT, crossT, hookT, upperT, ribs, thigh, belly. o.step: footwork in progress.
function solve(p, mode, o = {}) {
  const d = dims(p), H = d.H, s = p.lead;
  const t = o.t || 0;
  const guard = mode === "guard", down = mode === "down", fight = guard || down;
  const A = k => (guard ? clamp(o[k] || 0, 0, 1) : 0);
  const ej = A("ej"), ec = A("ec"), eh = A("eh"), eu = A("eu"), ek = A("ek"), elk = A("elk"), et = A("et");
  const cover = A("cover"), check = A("check"), rl = A("roll");
  const slip = guard ? clamp(o.slip || 0, -1, 1) : 0;
  const kickAmt = Math.max(ek, elk);
  const busy = Math.min(1, ej + ec + eh + eu + ek + elk + et + cover + check + rl + Math.abs(slip));
  const J = { d, footQ: {} };
  const wl = (1 + s) / 2, S = 2 * wl - 1;            // +1 orthodox, -1 southpaw (continuous)
  const rearX = -S;                                    // x sign of the rear side
  const leadSide = S >= 0 ? LEFT : RIGHT, rearSide = -leadSide;
  const live = REDUCE ? 0 : 1, calm = (1 - busy) * live;
  const TAU = Math.PI * 2;
  let drop, yaw, lean, roll = 0;
  const shift = V();
  const feet = {};
  if (fight) {
    const bounce = Math.sin(t * TAU * 1.55) * .009 * H * calm;           // light bounce on the balls of the feet
    const rock = Math.sin(t * TAU * .5) * .014 * H * calm;               // weight rocks front to back
    const sway = Math.sin(t * TAU * .37 + 1) * .011 * H * calm;          // head and hips drift off the centre line
    const dip = Math.sin(Math.PI * eu);                                   // uppercut: sink, then drive up
    const bob = Math.sin(Math.PI * rl);
    drop = .058 * H + bounce + .012 * H * ej + .024 * H * ec + .02 * H * eh + .05 * H * dip * (1 - eu * .5)
         - .03 * H * ek - .015 * H * elk - .02 * H * et + .035 * H * cover + .09 * H * bob
         + .025 * H * Math.abs(slip);
    yaw = -S * (.52 + .2 * ej) + S * .9 * ec + S * 1.3 * ek + S * 1.05 * elk - S * .55 * eh + S * .55 * eu
        + .05 * Math.sin(t * TAU * .3) * calm;
    lean = .11 + .06 * ej + .1 * ec + .06 * eh - .03 * eu - .34 * ek - .2 * elk - .3 * et + .14 * cover + .3 * bob;
    roll = -S * .28 * ek - S * .16 * elk + slip * .3 + bob * .2 * (o.rollDir || 1);
    shift.set(S * .02 * H * ek + slip * .075 * H + sway + bob * .05 * H * (o.rollDir || 1), 0,
              .035 * H * ec + .1 * H * ek + .05 * H * elk + .02 * H * eh + rock - .04 * H * et);
    feet[LEFT] = [V(.062 * H, 0, .17 * H).lerp(V(.088 * H, 0, -.15 * H), 1 - wl), -.2 * wl + .8 * (1 - wl)];
    feet[RIGHT] = [V(-.088 * H, 0, -.15 * H).lerp(V(-.062 * H, 0, .17 * H), 1 - wl), -.8 * wl + .2 * (1 - wl)];
    feet[rearSide][1] += S * .6 * ec + S * .4 * eu;   // rear heel turns out on the cross and uppercut
    feet[leadSide][1] += S * 1.35 * ek + S * 1.1 * elk - S * .5 * eh;   // lead foot turns to plant kicks, pivots on the hook
    if (down) { drop = .21 * H; yaw = -S * .25; lean = .58; roll = 0; shift.set(0, 0, -.05 * H); }
  } else {
    const breathe = REDUCE ? 0 : Math.sin(t * TAU * .25) * .002 * H;
    drop = .004 * H + breathe; yaw = 0; lean = .02;
    feet[LEFT] = [V(.07 * H, 0, .01 * H), .14]; feet[RIGHT] = [V(-.07 * H, 0, .01 * H), -.14];
  }
  // footwork: the moving foot leads, the other follows; feet stay planted while the body travels
  const lift = {};
  if (o.step && fight && !down) {
    const u = clamp(o.step.u, 0, 1), c = ease(u);
    for (const side of [LEFT, RIGHT]) {
      const own = side === o.step.first ? clamp(u / .62, 0, 1) : clamp((u - .32) / .68, 0, 1);
      feet[side][0] = feet[side][0].clone().addScaledVector(o.step.D, ease(own) - c);
      lift[side] = .045 * H * Math.sin(Math.PI * own);
    }
    drop += .012 * H * Math.sin(Math.PI * u);
  }
  if (o.flinch) shift.x += o.flinch;
  const Q = new THREE.Quaternion().setFromEuler(new THREE.Euler(lean, yaw, roll, "YXZ"));
  const crotch = V(0, ANAT.crotch * H - drop, ANAT.crotchZ * H).add(shift);
  const T = (x, y, z) => V(x, y, z).applyQuaternion(Q).add(crotch);
  J.Q = Q; J.crotch = crotch;
  J.hip = { [LEFT]: T(ANAT.hipX * H, ANAT.hipUp * H, .005 * H),
            [RIGHT]: T(-ANAT.hipX * H, ANAT.hipUp * H, .005 * H) };
  J.sh = { [LEFT]: T(d.sj, ANAT.shUp * H, ANAT.shZ * H), [RIGHT]: T(-d.sj, ANAT.shUp * H, ANAT.shZ * H) };
  J.neck = T(0, ANAT.neckUp * H, ANAT.neckZ * H);
  const neckTop = T(0, ANAT.headBoneUp * H, ANAT.headBoneZ * H);
  const chinTuck = .12 * Math.max(ej, ec, eh, eu) + .15 * cover;
  J.QH = Q.clone().multiply(new THREE.Quaternion().setFromEuler(new THREE.Euler(-.02 - lean * .55 + chinTuck, 0, -roll * .6)));
  J.head = neckTop.clone().add(V(0, ANAT.headUp * H, ANAT.headZ * H).applyQuaternion(J.QH));
  if (o.recoil) J.head.z -= o.recoil;

  // legs: the rear leg throws body and leg kicks, the lead leg teeps and checks
  J.ankle = {}; J.knee = {};
  const legLen = d.thigh + d.shin;
  const bez = (p0, p1, p2, u) => p0.clone().multiplyScalar((1 - u) * (1 - u)).addScaledVector(p1, 2 * u * (1 - u)).addScaledVector(p2, u * u);
  for (const side of [LEFT, RIGHT]) {
    const [f, fy] = feet[side];
    let ankle = V(f.x, ANAT.ankle * H + (lift[side] || 0), f.z);
    let pole = V(Math.sin(fy), 0, Math.cos(fy)).add(V(side * .15, 0, 0));
    const fq = new THREE.Quaternion().setFromEuler(new THREE.Euler(0, fy, 0));
    const kicking = kickAmt > 0 && side === rearSide, teeping = et > 0 && side === leadSide;
    if (down && side === rearSide) {                  // rear knee drops to the canvas
      ankle = V(rearX * .1 * H, .05 * H, -.27 * H);
      pole = V(0, -1, .55);
    }
    let footAim = null;
    if (kicking) {
      const low = elk > ek, hip = J.hip[side];
      const tgt = (low ? o.thigh : o.ribs) || hip.clone().add(V(-rearX * .06 * H, low ? -.16 * H : .16 * H, .45 * H));
      const dir = tgt.clone().sub(hip); const dist = dir.length(); dir.normalize();
      const hit = hip.clone().addScaledVector(dir, Math.min(legLen * .9995, dist - d.foot));
      const chamber = hip.clone().add(low ? V(rearX * .2 * H, -.22 * H, .08 * H) : V(rearX * .22 * H, -.05 * H, .12 * H));
      ankle = bez(ankle, chamber, hit, kickAmt);
      pole = V(0, .3, 1).lerp(V(rearX * .5, 1, .15), kickAmt);
      footAim = kickAmt;
    }
    if (teeping) {
      const hip = J.hip[side];
      const tgt = o.belly || hip.clone().add(V(0, .06 * H, .55 * H));
      const dir = tgt.clone().sub(hip); const dist = dir.length(); dir.normalize();
      const hit = hip.clone().addScaledVector(dir, Math.min(legLen * .9995, dist - d.foot * .5));
      const chamber = hip.clone().add(V(0, -.1 * H, .24 * H));          // knee up in front, then push
      ankle = bez(ankle, chamber, hit, et);
      pole = V(side * .1, .6, 1);
    }
    if (check > 0 && side === leadSide) {              // lift the lead knee to check a leg kick
      ankle.lerp(V(f.x * .9, .3 * H, f.z - .03 * H), check);
      pole = pole.lerp(V(side * .8, .2, 1), check);
    }
    const { joint, end } = ik(J.hip[side], ankle, d.thigh, d.shin, pole);
    if (joint.y < .035 * H) joint.y = .035 * H;
    J.knee[side] = joint; J.ankle[side] = end;
    if (footAim) {
      const pq = new THREE.Quaternion().setFromUnitVectors(ZAX, end.clone().sub(joint).normalize());
      fq.slerp(pq, clamp(footAim * 1.6, 0, 1));
    }
    if (teeping) {                                      // sole of the foot pushes forward
      const pq = new THREE.Quaternion().setFromUnitVectors(ZAX, V(0, 1, .25).normalize());
      fq.slerp(pq, clamp(et * 1.3, 0, 1));
    }
    J.footQ[side] = fq;
  }

  // arms
  J.elbow = {}; J.wrist = {}; J.fdir = {};
  const chin = J.head.clone().add(V(0, -.056 * H, .03 * H));
  const bent = Math.sqrt(d.upper * d.upper + d.fore * d.fore);    // shoulder to wrist with a 90 degree elbow
  for (const side of [LEFT, RIGHT]) {
    const sh = J.sh[side];
    let wrist, pole;
    if (fight) {
      const wLead = clamp((1 + side * s) / 2, 0, 1), isLead = wLead > .5;
      const leadT = chin.clone().add(V(side * .028 * H, .012 * H, .17 * H));
      const rearT = chin.clone().add(V(side * .056 * H, -.004 * H, .05 * H));
      wrist = rearT.lerp(leadT, wLead);
      if (isLead)                                       // the lead hand paws and measures
        wrist.add(V(Math.sin(t * TAU * .9) * .012 * H, Math.sin(t * TAU * 1.3) * .01 * H,
                    (Math.sin(t * TAU * .45) * .5 + .5) * .028 * H).multiplyScalar(calm));
      pole = V(side * .6, -1, -.25);
      const tight = Math.max(cover, rl * .8);
      if (tight > 0) {                                  // high guard: gloves to the temples, elbows in
        wrist.lerp(chin.clone().add(V(side * .07 * H, .075 * H, .045 * H)), tight);
        pole.lerp(V(side * .25, -1, -.05), tight);
      }
      const straight = isLead ? ej : ec, tgtS = isLead ? o.jabT : o.crossT;
      const other = isLead ? Math.max(ec, eu) : Math.max(ej, eh);
      if (other > 0) wrist.lerp(chin.clone().add(V(side * .05 * H, 0, .06 * H)), other * .6);
      if (straight > 0) {
        const tgt = tgtS || sh.clone().add(V(0, -.02 * H, 1));
        const dir = tgt.clone().sub(sh); const dist = dir.length(); dir.normalize();
        const reach = Math.min((d.upper + d.fore) * .9995, Math.max(dist - d.hand, .05));
        wrist.lerp(sh.clone().addScaledVector(dir, reach), straight);
      }
      if (isLead && eh > 0) {                           // lead hook: wide arc, elbow up, fist level
        const tgt = o.hookT || sh.clone().add(V(-side * .16 * H, .02 * H, .42 * H));
        const dir = tgt.clone().sub(sh); const dist = dir.length(); dir.normalize();
        const hit = sh.clone().addScaledVector(dir, Math.min(bent * 1.02, Math.max(dist - d.hand, .05)));
        wrist = bez(wrist, sh.clone().add(V(side * .3 * H, -.02 * H, .14 * H)), hit, eh);
        pole.lerp(V(side * .45, .9, -.35), Math.min(1, eh * 1.6));
      }
      if (!isLead && eu > 0) {                          // rear uppercut: drop the hand, drive up the middle
        const tgt = o.upperT || chin.clone().add(V(0, 0, .35 * H));
        const dir = tgt.clone().sub(sh); const dist = dir.length(); dir.normalize();
        const hit = sh.clone().addScaledVector(dir, Math.min(bent * .98, Math.max(dist - d.hand, .05)));
        wrist = bez(wrist, sh.clone().add(V(side * .02 * H, -.25 * H, .15 * H)), hit, eu);
        pole.lerp(V(side * .35, -1, -.2), Math.min(1, eu * 1.6));
      }
      if (kickAmt > 0) {
        if (!isLead) wrist.lerp(sh.clone().add(V(side * .16 * H, -(d.upper + d.fore) * .75, -.22 * H)), kickAmt);
        else wrist.lerp(chin.clone().add(V(side * .04 * H, .012 * H, .07 * H)), kickAmt * .7);
      }
      if (et > 0) wrist.lerp(chin.clone().add(V(side * .06 * H, -.02 * H, .1 * H)), et * .5);
      if (down && isLead) { wrist = V(side * .17 * H, .07 * H, .2 * H); pole = V(side * .6, .2, -1); }   // posts a glove on the mat
    } else if (mode === "stand") {
      wrist = sh.clone().add(V(side * .045 * H, -(d.upper + d.fore) * .965, .03 * H));
      pole = V(side * .25, 0, -1);
    } else {
      wrist = sh.clone().add(V(side * (d.upper + d.fore) * .9995, 0, 0));
      pole = V(0, 0, -1);
    }
    const { joint, end } = ik(sh, wrist, d.upper, d.fore, pole);
    J.elbow[side] = joint; J.wrist[side] = end;
    J.fdir[side] = end.clone().sub(joint).normalize();
  }
  return J;
}

function blendJ(A, B, k) {
  if (k >= 1) return B;
  if (k <= 0) return A;
  const out = { d: B.d, footQ: {} };
  for (const key of ["crotch", "neck", "head"]) out[key] = A[key].clone().lerp(B[key], k);
  out.Q = A.Q.clone().slerp(B.Q, k);
  out.QH = A.QH.clone().slerp(B.QH, k);
  for (const key of ["hip", "sh", "ankle", "knee", "elbow", "wrist", "fdir"]) {
    out[key] = {};
    for (const s of [LEFT, RIGHT]) out[key][s] = A[key][s].clone().lerp(B[key][s], k);
  }
  for (const s of [LEFT, RIGHT]) out.footQ[s] = A.footQ[s].clone().slerp(B.footQ[s], k);
  return out;
}

const Y1 = V(0, 1, 0);
class Fighter {

      skin: skinMaterial(COL.skin),
      kit: new THREE.MeshPhysicalMaterial({ color: kit, roughness: .72, sheen: .5, sheenRoughness: .55,
        sheenColor: new THREE.Color(kit).lerp(new THREE.Color("#ffffff"), .12), side: THREE.DoubleSide }),
      pad: new THREE.MeshPhysicalMaterial({ color: "#121214", roughness: .34, clearcoat: .7, clearcoatRoughness: .28,
        sheen: .4, sheenColor: new THREE.Color("#8a8a92"), side: THREE.DoubleSide }),     // black fight-glove leather
      patch: new THREE.MeshStandardMaterial({ color: kit, roughness: .5, emissive: kit, emissiveIntensity: .08,
        side: THREE.DoubleSide }),
      band: new THREE.MeshStandardMaterial({ color: "#121214", roughness: .55, side: THREE.DoubleSide }),
      gold: new THREE.MeshStandardMaterial({ color: COL.rule, roughness: .35, emissive: COL.rule,
        emissiveIntensity: .6, side: THREE.DoubleSide }),
      eye: new THREE.MeshPhysicalMaterial({ color: "#d8d0c6", roughness: .2, clearcoat: 1, clearcoatRoughness: .05 }),
      iris: new THREE.MeshPhysicalMaterial({ color: "#3a2416", roughness: .3, clearcoat: 1, clearcoatRoughness: .03 }),
      pupil: new THREE.MeshStandardMaterial({ color: "#050505", roughness: .2 }),
      leather: new THREE.MeshPhysicalMaterial({ color: "#141416", roughness: .42, clearcoat: .35,
        clearcoatRoughness: .4, side: THREE.DoubleSide }),
    };
    for (const m of Object.values(this.mats)) { m.envMap = ENV; m.envMapIntensity = m === this.mats.skin ? .45 : .6; }
    this.meshes = [];
    this.rig = null;

    this.arc = new THREE.Mesh(new THREE.BufferGeometry(), new THREE.MeshBasicMaterial({
      color: corner, transparent: true, opacity: .95, depthWrite: false, side: THREE.DoubleSide }));
    this.arcFill = new THREE.Mesh(new THREE.BufferGeometry(), new THREE.MeshBasicMaterial({
      color: corner, transparent: true, opacity: .1, depthWrite: false, side: THREE.DoubleSide }));

const MODES = { face: "guard", tape: "stand", reach: "tpose" };

function cornerOf(i, f) { return f.corner || (i === 0 ? COL.a : COL.b); }

function syncFighters() {
  const list = figs.slice(0, 2);
  while (fighters.length > list.length) fighters.pop().dispose();
  list.forEach((f, i) => {
    const corner = cornerOf(i, f);
    if (!fighters[i] || fighters[i].corner !== corner) {
      if (fighters[i]) fighters[i].dispose();

// Face-off geometry. The distance is set where the longer jab just touches the other's face;
// every other strike is then measured from that same spot. A lone fighter spars a mirror of itself.
const leadOf = p => (p.lead > 0 ? LEFT : RIGHT);
function faceoff() {
  const A = fighters[0], B = fighters[1] || null;
  const pp = [A.p, B ? B.p : A.p];
  const stat = pp.map(p => solve(p, "guard", {}));
  const jabJ = pp.map(p => solve(p, "guard", { ej: 1 }));
  const faceL = i => stat[i].head.clone().add(V(0, -.012 * pp[i].H, stat[i].d.headR * .9));
  // d at which fighter i's jab just reaches fighter j's face
  const dFor = (i, j) => {
    const sh = jabJ[i].sh[leadOf(pp[i])], f = faceL(j), arm = jabJ[i].d.arm;
    const dx = -f.x - sh.x, dy = f.y - sh.y;
    return sh.z + Math.sqrt(Math.max(arm * arm - dx * dx - dy * dy, .01)) + f.z;
  };
  const dA = dFor(0, 1), dB = dFor(1, 0);
  const d = Math.max(dA, dB, .75);
  const toOther = v => V(-v.x, v.y, d - v.z);
  const res = [0, 1].map(i => {
    const j = 1 - i, p = pp[i], rearX = p.lead > 0 ? RIGHT : LEFT;
    const face = toOther(faceL(j));
    const ribs = toOther(stat[j].crotch.clone().add(V(0, .19 * pp[j].H, .065 * pp[j].H).applyQuaternion(stat[j].Q)))
      .add(V(rearX * .05 * pp[j].H, 0, 0));
    const Jc = solve(p, "guard", { ec: 1 }), Jk = solve(p, "guard", { ek: 1, ribs });
    const lead = leadOf(p), rear = -lead;
    return {
      face, ribs, rearX,
      sh: jabJ[i].sh[lead], dz: Math.sqrt(Math.max(jabJ[i].d.arm ** 2 - (face.y - jabJ[i].sh[lead].y) ** 2, .01)),
      gap: {
        ej: face.distanceTo(jabJ[i].sh[lead]) - jabJ[i].d.arm,
        ec: face.distanceTo(Jc.sh[rear]) - Jc.d.arm,
        ek: ribs.distanceTo(Jk.hip[rear]) - (Jk.d.thigh + Jk.d.shin + Jk.d.foot),
      },
    };
  });
  return { d, res, single: !B, dist: [dA, dB] };
}

// ------------------------------------------------------------------ fight director
// Every move has a duration and the fractions of it where the strike arrives (a) and leaves (b):
// punches snap out and come straight home, kicks chamber and recoil.
const MOVES = {
  ej:  { dur: .42, a: .3,  b: .4,  name: "Jab" },
  ec:  { dur: .52, a: .3,  b: .4,  name: "Cross" },
  eh:  { dur: .6,  a: .4,  b: .5,  name: "Hook" },
  eu:  { dur: .58, a: .44, b: .54, name: "Uppercut" },
  ek:  { dur: 1.0, a: .36, b: .52, name: "Body kick" },
  elk: { dur: .84, a: .4,  b: .55, name: "Leg kick" },
  et:  { dur: .84, a: .4,  b: .56, name: "Teep" },
  slip:  { dur: .5,  a: .3, b: .55 },
  cover: { dur: .62, a: .2, b: .72 },
  check: { dur: .72, a: .3, b: .66 },
  roll:  { dur: .64, a: .5, b: .5 },

const STRIKES = { ej: "Jab", ec: "Cross", ek: "Kick" };

function envelope(m, u) {

// Combos and how the other fighter answers each strike ("" = it lands if it reaches).
const COMBOS = [
  { name: "1-2", seq: [["ej", 0], ["ec", .3]], react: ["", "slip"] },
  { name: "1-2-3", seq: [["ej", 0], ["ec", .3], ["eh", .66]], react: ["cover", "", "roll"] },
  { name: "1-2, leg kick", seq: [["ej", 0], ["ec", .3], ["elk", .7]], react: ["slip", "cover", "check"] },
  { name: "Jab, body cross, hook", seq: [["ej", 0], ["ec", .34, "body"], ["eh", .76]], react: ["", "", "cover"] },
  { name: "Double jab, cross", seq: [["ej", 0], ["ej", .27], ["ec", .56]], react: ["", "slip", ""] },
  { name: "1-6-3", seq: [["ej", 0], ["eu", .32], ["eh", .72]], react: ["cover", "", "cover"] },
  { name: "Teep", seq: [["et", 0]], react: [""] },
  { name: "1-2, body kick", seq: [["ej", 0], ["ec", .3], ["ek", .72]], react: ["slip", "cover", ""], ko: true },

  const ev = [];

    const m = { jab: "ej", cross: "ec", kick: "ek" }[sel];
    for (let i = 0; i < (n > 1 ? 2 : 1); i++) {
      ev.push({ kind: "strike", who: i, m, t0: t, dur: MOVES[m].dur, tgt: TARGET_OF[m], ko: m === "ek", combo: MOVES[m].name });
      t += m === "ek" ? 3.2 : 2.2;

  }

  COMBOS.forEach((C, x) => {
    if (n > 1) { ev.push({ kind: "circle", t0: t, dur: .95, ang: .34 * dir }); t += 1.1; dir = -dir; }
    else t += .5;

    ev.push({ kind: "step", who: att, t0: t, dur: .34, dir: 1, depth: close ? .22 : .1 }); t += .3;
    let end = t;

  const rAtt = (i, depth = .1) => n > 1 ? (P.spar ? fo.dist[i] - depth : fo.d) : -.25;   // combos go in past jab range

  [0, 1].forEach(i => {
    const st = steps[i];

// impact flash: two expanding rings that face the camera
const flashes = [];
const ringGeo = new THREE.RingGeometry(.82, 1, 48);

  for (const delay of [0, .08]) {
    const m = new THREE.Mesh(ringGeo, new THREE.MeshBasicMaterial({ color: COL.hit, transparent: true,
      opacity: 0, depthTest: false, blending: THREE.AdditiveBlending }));

  for (let i = flashes.length - 1; i >= 0; i--) {

    f.m.quaternion.copy(camera.quaternion);
    f.m.scale.setScalar(.025 + .15 * easeOut(t));

// ------------------------------------------------------------------ camera framing
function frameFor(m) {
  const n = fighters.length;

  const maxR = Math.max(...fighters.map(f => f.target.R));
  const aspect = camera.aspect || 1.4;
  const tanH = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));

    az = n > 1 ? .34 : 1.05; el = .14;
  } else if (m === "tape") {

    for (const [key, b] of Object.entries(btn)) b.classList.toggle("on", key === m);
    document.getElementById("strikes").style.display = m === "face" ? "" : "none";
    if (args.strike && ["spar", "jab", "cross", "kick"].includes(args.strike)) setStrike(args.strike);
    if (args.autorotate === false || REDUCE) controls.autoRotate = false;
    syncSpin();
    flyTo(mode, true);
    firstRender = false;
  } else if (countChanged) {
    flyTo(mode);
  }
});

if (window.parent === window) {
  const demo = location.hash ? JSON.parse(decodeURIComponent(location.hash.slice(1))) : {
    figures: [
      { label: "Conor McGregor", height_cm: 175, weight_kg: 70, reach_cm: 188, stance: "Southpaw", hand: "Right", foot: "Right" },
      { label: "Khabib Nurmagomedov", height_cm: 178, weight_kg: 70, reach_cm: 178, stance: "Orthodox", hand: "Right", foot: "Left", ghost: true }] };
  window.postMessage({ type: "streamlit:render", args: { height: window.innerHeight, ...demo } }, "*");
} else {
  send("streamlit:componentReady", { apiVersion: 1 });
}
</script>
