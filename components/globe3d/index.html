<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Globe 3D</title>
<style>
  @font-face { font-family: "Inter"; src: url("fonts/inter-latin-variable.woff2") format("woff2"); font-weight: 400 600; }
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden;
               font-family: "Inter", system-ui, sans-serif; color: #FFFFFF; font-variant-numeric: tabular-nums; }
  #wrap { position: relative; width: 100%; height: 100%; overflow: hidden; box-sizing: border-box; }
  canvas { display: block; position: relative; }
  #labels { position: absolute; inset: 0; pointer-events: none; }
  .lbl { position: absolute; transform: translate(-50%, calc(-100% - 10px)); white-space: nowrap;
         background: #1C1C1C; border-radius: 6px; padding: 5px 8px 6px; font-size: 12px;
         line-height: 1.35; color: #B4B4B4; pointer-events: auto; cursor: pointer; transition: opacity .15s; }
  .lbl.below { transform: translate(-50%, 10px); }
  .lbl b { color: #FFFFFF; font-weight: 600; font-size: 12px; }
  .lbl .n { color: #FFFFFF; background: #2A2A2A; border-radius: 4px; padding: 0 5px; font-weight: 500;
            margin-left: 5px; font-size: 11px; }
  .lbl .more { color: #949494; }
  .lbl.sel { background: #FFFFFF; color: #333; }
  .lbl.sel b, .lbl.sel .n { color: #000; } .lbl.sel .n { background: #E6E6E6; } .lbl.sel .more { color: #555; }
  .lbl.small { padding: 3px 7px; }
  .hud { position: absolute; right: 8px; bottom: 8px; display: flex; gap: 0; }
  button { background: #131316; color: #A9A9B1; border: 1px solid #3A3A42; padding: 0 12px; height: 30px;
           font-size: 12px; font-weight: 500; cursor: pointer; font-family: inherit; }
  button:first-child { border-radius: 3px 0 0 3px; } button:last-child { border-radius: 0 3px 3px 0; }
  button + button { border-left: none; }
  button.on { color: #FFFFFF; background: #24242A; }
  button:active { transform: scale(.97); }
  button:focus-visible, canvas:focus-visible { outline: 2px solid #FFFFFF; outline-offset: -2px; }
  .sr-only { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
  .hint { display: none; }
  .legend { display: none; }
</style>
<script src="./topojson-client.min.js"></script>
<script type="importmap">{ "imports": { "three": "./three.module.min.js" } }</script>
</head>
<body>
<div id="wrap">
  <div id="labels"></div>
  <div class="legend" id="legend"></div>
  <div class="hud">
    <button id="bSpin" class="on" aria-pressed="true">Auto-rotate</button>
    <button id="bNames" class="on" aria-pressed="true">Names</button>
    <button id="bReset">Reset</button>
  </div>
  <div class="hint" aria-hidden="true">Drag to turn, scroll to zoom, click a country to filter</div>
  <p class="sr-only" id="kbd">Globe of fighters by country. Focus it and use the arrow keys to turn and plus or minus to zoom. The same countries can be filtered with the continent buttons and sidebar.</p>
</div>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "./OrbitControls.js";

const send = (type, data = {}) =>
  window.parent.postMessage({ isStreamlitMessage: true, type, ...data }, "*");

// ------------------------------------------------------------------ scene
const wrap = document.getElementById("wrap");
const labelsEl = document.getElementById("labels");
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
wrap.prepend(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(32, 1, 0.1, 100);
camera.position.set(0, 0.8, 3.7);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.enablePan = false;
controls.minDistance = 2.0;
controls.maxDistance = 6;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.55;
if (matchMedia("(prefers-reduced-motion: reduce)").matches) controls.autoRotate = false;
// keyboard orbit for the canvas (WCAG 2.1.1): arrows turn, +/- zoom
function keyOrbit(el, onKey) {
  el.tabIndex = 0;
  el.addEventListener("keydown", (e) => {
    const sph = new THREE.Spherical().setFromVector3(camera.position.clone().sub(controls.target));
    const step = 0.12;
    if (e.key === "ArrowLeft") sph.theta -= step;
    else if (e.key === "ArrowRight") sph.theta += step;
    else if (e.key === "ArrowUp") sph.phi = Math.max(0.2, sph.phi - step);
    else if (e.key === "ArrowDown") sph.phi = Math.min(controls.maxPolarAngle, sph.phi + step);
    else if (e.key === "+" || e.key === "=") sph.radius = Math.max(controls.minDistance, sph.radius * 0.9);
    else if (e.key === "-") sph.radius = Math.min(controls.maxDistance, sph.radius * 1.1);
    else return;
    e.preventDefault();
    if (onKey) onKey();
    camera.position.copy(controls.target).add(new THREE.Vector3().setFromSpherical(sph));
    controls.update();
  });
}
keyOrbit(renderer.domElement, () => { controls.autoRotate = false; bSpin.classList.remove("on"); bSpin.setAttribute("aria-pressed", "false"); });
renderer.domElement.setAttribute("role", "img");
renderer.domElement.setAttribute("aria-describedby", "kbd");
renderer.domElement.setAttribute("aria-label", "Rotatable globe of fighters by country");

scene.add(new THREE.AmbientLight("#ffffff", 1.6));
const sun = new THREE.DirectionalLight("#ffffff", 1.1);
sun.position.set(-3, 2, 4);
scene.add(sun);
const rim = new THREE.DirectionalLight("#FFFFFF", 0.35);
rim.position.set(3, -1, -3);
scene.add(rim);

const globe = new THREE.Group();
scene.add(globe);

// atmosphere glow
const glow = new THREE.Mesh(new THREE.SphereGeometry(1.08, 64, 48), new THREE.ShaderMaterial({
  transparent: true, side: THREE.BackSide, depthWrite: false,
  uniforms: { c: { value: new THREE.Color("#E0343C") } },
  vertexShader: `varying vec3 vN; void main(){ vN = normalize(normalMatrix*normal);
    gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.0);} `,
  fragmentShader: `uniform vec3 c; varying vec3 vN; void main(){
    float i = pow(0.62 - dot(vN, vec3(0.0,0.0,1.0)), 3.0);
    gl_FragColor = vec4(c, clamp(i,0.0,1.0)*0.6); }`,
}));
// no atmosphere glow: the globe sits flat on the panel


// ------------------------------------------------------------------ geography
const V = (x, y, z) => new THREE.Vector3(x, y, z);
function ll2v(lat, lon, r = 1) {
  const phi = (lon + 180) / 360 * Math.PI * 2;
  const th = (90 - lat) / 180 * Math.PI;
  return V(-Math.cos(phi) * Math.sin(th) * r, Math.cos(th) * r, Math.sin(phi) * Math.sin(th) * r);
}

let world = null, countries = [];
const TEX_W = 4096, TEX_H = 2048;
const texCanvas = document.createElement("canvas");
texCanvas.width = TEX_W; texCanvas.height = TEX_H;
const tex = new THREE.CanvasTexture(texCanvas);
tex.colorSpace = THREE.SRGBColorSpace;
tex.anisotropy = 8;
const sphere = new THREE.Mesh(new THREE.SphereGeometry(1, 128, 96),
  new THREE.MeshStandardMaterial({ map: tex, roughness: 0.95, metalness: 0.0 }));
globe.add(sphere);
const spikes = new THREE.Group();
globe.add(spikes);

function ramp(t) {  // grey -> light grey -> white: more fighters, brighter country (red and blue are kept for stance)
  const stops = [[0x4A, 0x4A, 0x4A], [0x9A, 0x9A, 0x9A], [0xFF, 0xFF, 0xFF]];
  const [p, q, k] = t < 0.5 ? [stops[0], stops[1], t * 2] : [stops[1], stops[2], (t - 0.5) * 2];
  return `rgb(${p.map((v, i) => Math.round(v + (q[i] - v) * k)).join(",")})`;
}

function drawRing(ctx, ring) {
  // split rings that cross the antimeridian
  let prev = null;
  ring.forEach(([lon, lat], i) => {
    const x = (lon + 180) / 360 * TEX_W, y = (90 - lat) / 180 * TEX_H;
    if (i === 0 || (prev && Math.abs(lon - prev) > 180)) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    prev = lon;
  });
  ctx.closePath();
}

function paint(data) {
  const ctx = texCanvas.getContext("2d");
  ctx.fillStyle = "#171717";
  ctx.fillRect(0, 0, TEX_W, TEX_H);
  // graticule
  ctx.strokeStyle = "#222222"; ctx.lineWidth = 2;
  for (let lon = -180; lon <= 180; lon += 30) {
    const x = (lon + 180) / 360 * TEX_W; ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, TEX_H); ctx.stroke();
  }
  for (let lat = -60; lat <= 60; lat += 30) {
    const y = (90 - lat) / 180 * TEX_H; ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(TEX_W, y); ctx.stroke();
  }
  const byIso = Object.fromEntries((data || []).map(d => [d.iso3, d]));
  const max = Math.max(1, ...(data || []).map(d => d.value));
  for (const f of countries) {
    const d = byIso[f.id];
    ctx.beginPath();
    const polys = f.geometry.type === "Polygon" ? [f.geometry.coordinates] : f.geometry.coordinates;
    for (const poly of polys) for (const ring of poly) drawRing(ctx, ring);
    ctx.fillStyle = d ? ramp(Math.sqrt(d.value / max)) : "#262626";
    ctx.fill("evenodd");
    ctx.strokeStyle = "#171717";
    ctx.lineWidth = d ? 2.6 : 1.6;
    ctx.stroke();
  }
  tex.needsUpdate = true;
}

// ------------------------------------------------------------------ data layer
let state = { countries: [], selected: null, maxNames: 3, metricLabel: "fighters" };
let labels = [];
let showNames = true;

function buildSpikes() {
  spikes.clear();
  const max = Math.max(1, ...state.countries.map(d => d.count));
  for (const d of state.countries) {
    const h = 0.025 + 0.11 * Math.sqrt(d.count / max);
    const base = ll2v(d.lat, d.lon, 1.0), top = ll2v(d.lat, d.lon, 1.0 + h);
    const geo = new THREE.CylinderGeometry(0.009, 0.009, h, 10);
    const m = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({
      color: "#FFFFFF", emissive: "#FFFFFF", emissiveIntensity: 0.25 }));
    m.position.copy(base).add(top).multiplyScalar(0.5);
    m.quaternion.setFromUnitVectors(V(0, 1, 0), base.clone().normalize());
    spikes.add(m);
    const cap = new THREE.Mesh(new THREE.SphereGeometry(0.016, 12, 10),
      new THREE.MeshBasicMaterial({ color: "#FFFFFF" }));
    cap.position.copy(top);
    spikes.add(cap);
    d._anchor = ll2v(d.lat, d.lon, 1.005);
  }
}

function buildLabels() {
  labelsEl.innerHTML = "";
  labels = state.countries
    .slice().sort((a, b) => b.count - a.count)
    .map(d => {
      const el = document.createElement("div");
      el.className = "lbl";
      const names = d.fighters.slice(0, state.maxNames);
      const more = d.fighters.length - names.length;
      el.innerHTML = `<b>${d.name}</b><span class="n">${d.count}</span>` +
        (showNames ? `<div>${names.join("<br>")}${more > 0 ? `<br><span class="more">+${more} more</span>` : ""}</div>` : "");
      el.classList.toggle("small", !showNames);
      el.onclick = () => select(d.iso3);
      labelsEl.appendChild(el);
      return { d, el };
    });
  markSelected();
}

function markSelected() {
  for (const l of labels) l.el.classList.toggle("sel", l.d.iso3 === state.selected);
}

function select(iso) {
  state.selected = state.selected === iso ? null : iso;
  markSelected();
  send("streamlit:setComponentValue", { value: state.selected, dataType: "json" });
  if (state.selected) focusOn(iso);
}

function focusOn(iso) {
  const d = state.countries.find(c => c.iso3 === iso);
  if (!d) return;
  const dist = camera.position.length();
  const target = ll2v(d.lat, d.lon, dist).applyMatrix4(globe.matrixWorld);
  flyFrom = camera.position.clone(); flyTo = target; flyT = 0;
  controls.autoRotate = false; bSpin.classList.remove("on");
}
let flyFrom = null, flyTo = null, flyT = 1;

// ------------------------------------------------------------------ label placement
const tmp = new THREE.Vector3();
function placeLabels() {
  const w = wrap.clientWidth, h = wrap.clientHeight;
  const camDir = camera.position.clone().normalize();
  const placed = [];
  for (const { d, el } of labels) {
    if (!d._anchor) continue;
    const world = d._anchor.clone().applyMatrix4(globe.matrixWorld);
    const facing = world.clone().normalize().dot(camDir);
    if (facing < 0.25) { el.style.opacity = 0; el.style.visibility = "hidden"; continue; }
    tmp.copy(world).project(camera);
    const x = (tmp.x + 1) / 2 * w, y = (1 - tmp.y) / 2 * h;
    const bw = el.offsetWidth, bh = el.offsetHeight;
    let below = false;
    let r = { l: x - bw / 2, r: x + bw / 2, t: y - bh - 10, b: y - 10 };
    if (r.t < 24) { below = true; r = { l: r.l, r: r.r, t: y + 10, b: y + bh + 10 }; }
    const out = r.t < 24 || r.l < 4 || r.r > w - 4 || r.b > h - 40;
    const hit = out || placed.some(p => !(r.r < p.l || r.l > p.r || r.b < p.t || r.t > p.b));
    el.classList.toggle("below", below);
    const isSel = d.iso3 === state.selected;
    if (hit && !isSel) { el.style.opacity = 0; el.style.visibility = "hidden"; continue; }
    placed.push(r);
    el.style.visibility = "visible";
    el.style.opacity = Math.min(1, (facing - 0.25) * 4);
    el.style.left = x + "px"; el.style.top = y + "px";
    el.style.zIndex = isSel ? 10 : Math.round(d.count);
  }
}

// ------------------------------------------------------------------ loop & resize
function fitDistance() {
  // distance at which the globe (plus glow and spikes) just fits the narrower field of view
  const half = THREE.MathUtils.degToRad(camera.fov / 2);
  const halfH = Math.min(half, Math.atan(Math.tan(half) * camera.aspect));
  return 1.13 / Math.sin(halfH);
}
function resize() {
  const w = wrap.clientWidth, h = wrap.clientHeight;
  renderer.setSize(w, h, false);
  renderer.domElement.style.width = w + "px"; renderer.domElement.style.height = h + "px";
  if (w < 10 || h < 10) return;
  camera.aspect = w / h;
  if (Number.isFinite(camera.position.x) && camera.position.lengthSq() > 0)
    camera.position.setLength(fitDistance());
  camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(wrap);

renderer.setAnimationLoop(() => {
  if (wrap.clientHeight < 10) return;           // iframe not sized yet
  if (!Number.isFinite(camera.position.x)) {    // recover from a degenerate first frame
    camera.position.set(0, 0.8, 3.7); controls.target.set(0, 0, 0); resize();
  }
  if (flyT < 1 && flyFrom) {
    flyT = Math.min(1, flyT + 0.035);
    const k = 1 - Math.pow(1 - flyT, 3);
    camera.position.copy(flyFrom).lerp(flyTo, k).setLength(flyFrom.length());
  }
  controls.update();
  renderer.render(scene, camera);
  placeLabels();
});

// ------------------------------------------------------------------ UI
const bSpin = document.getElementById("bSpin"), bNames = document.getElementById("bNames");
bSpin.onclick = () => { controls.autoRotate = !controls.autoRotate; bSpin.classList.toggle("on", controls.autoRotate); bSpin.setAttribute("aria-pressed", String(controls.autoRotate)); };
bNames.onclick = () => { showNames = !showNames; bNames.classList.toggle("on", showNames); bNames.setAttribute("aria-pressed", String(showNames)); buildLabels(); };
document.getElementById("bReset").onclick = () => {
  camera.position.set(0, 0.8, 3.7); resize(); controls.autoRotate = true; bSpin.classList.add("on");
  if (state.selected) select(state.selected);
};

function legend() {
  const vals = state.countries.map(d => d.count);
  const max = vals.length ? Math.max(...vals) : 0;
  document.getElementById("legend").innerHTML = vals.length
    ? `Fighters per country<div class="bar"></div><div class="ends"><span>1</span><span>${max}</span></div>`
    : "No fighters match these filters";
}

// ------------------------------------------------------------------ inputs
let frameHeight = 0, pending = null;
function apply(args) {
  if (!world) { pending = args; return; }
  const h = args.height || 560;
  if (h !== frameHeight) { frameHeight = h; wrap.style.height = h + "px"; send("streamlit:setFrameHeight", { height: h }); resize(); }
  state.countries = (args.countries || []).map(d => ({ ...d, value: d.count }));
  state.maxNames = args.max_names ?? 3;
  if (args.selected !== undefined && args.selected !== state.selected) state.selected = args.selected;
  paint(state.countries);
  buildSpikes();
  buildLabels();
  legend();
}

window.addEventListener("message", (e) => {
  const d = e.data;
  if (d && d.type === "streamlit:render") apply(d.args || {});
});

fetch("./world_110m.json").then(r => r.json()).then(topo => {
  world = topo;
  countries = topojson.feature(topo, topo.objects.countries).features;
  // start facing the Atlantic so the Americas and Europe are both in view
  globe.rotation.y = -0.35;
  if (pending) { apply(pending); pending = null; } else paint([]);
});

if (window.parent === window) {
  const demo = location.hash ? JSON.parse(decodeURIComponent(location.hash.slice(1))) : { countries: [] };
  setTimeout(() => window.postMessage({ type: "streamlit:render", args: { height: window.innerHeight, ...demo } }, "*"), 50);
} else {
  send("streamlit:componentReady", { apiVersion: 1 });
}
</script>
</body>
</html>
