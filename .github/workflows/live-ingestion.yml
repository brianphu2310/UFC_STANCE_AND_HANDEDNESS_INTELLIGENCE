name: Live ingestion (manual)

# Runs the polite UFCStats scraper from a GitHub-hosted runner (which has internet) and publishes
# the raw CSV, the run log and a row-count summary as a workflow artifact. This is the evidence
# that the live fetch works; it is NOT part of the normal CI and does not change committed data.
on:
  workflow_dispatch:
    inputs:
      max_pages:
        description: "Index pages to fetch"
        default: "2"
      max_details:
        description: "Fighter detail pages to fetch"
        default: "10"

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-ingestion.txt
      - name: Fetch (robots.txt checked, 1.5 s between requests)
        run: |
          mkdir -p data/raw
          python -m ingestion.ufcstats --max-pages ${{ inputs.max_pages }} --max-details ${{ inputs.max_details }} -v 2>&1 | tee data/raw/run.log
      - name: Summary
        if: always()
        run: |
          {
            echo "## Live UFCStats ingestion"
            echo "- Run at: $(date -u +%FT%TZ)"
            if [ -f data/raw/ufcstats_fighters.csv ]; then
              echo "- Rows: $(($(wc -l < data/raw/ufcstats_fighters.csv) - 1))"
              echo '```'; head -6 data/raw/ufcstats_fighters.csv; echo '```'
            else
              echo "- No CSV written (see run.log)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ufcstats-live-ingestion
          path: data/raw/
